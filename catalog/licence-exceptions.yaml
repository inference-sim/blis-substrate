# Models whose config.json is committed although its licence is not on the X12 allow-list
# (contracts/vocab: vocab.RedistributableLicences). Each waits for a person to read its licence
# and decide: add the licence to the allow-list, or remove the committed config.json and keep
# only its hash and revision in model.yaml, so the nightly fetch job derives the graph.
#
# validate-catalog fails on a committed config.json whose licence is neither allowed nor listed
# here, and on an entry here whose model's licence differs from the one recorded, or that names
# a model with an allowed licence. Remove an entry in the change that resolves it; the list only
# shrinks.

