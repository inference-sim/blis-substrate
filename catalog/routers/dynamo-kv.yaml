# Dynamo's frontend in its kv mode, with no session affinity configured. The entry records that
# no policy in the table's closed list is close enough, and why. Every citation is a line of a
# router's own code at the commit named, or of llm-d's router at the commit the module tag
# v1.0.0-blis.3 of inference-sim/llm-d-router points to.
kind: RouterMapping
router: dynamo
mode: kv
revisions:
  - 1682167d3c97f0fc8cd405dee51f17288eeaeb55
policy: none
reason: >-
  Dynamo's kv mode scores each worker by a cost, overlap_score_weight times the blocks of the
  prompt the worker has not cached plus the decode blocks the router tracks as active on it,
  with weight 1.0 and temperature 0 by default, so the lowest cost wins and a tie goes to the
  smaller prefix tree. Both terms are the router's own accounting, fed by the workers' KV events,
  and the router can hold a request in a queue of its own when the workers are busy
  (router_queue_threshold). No policy in the closed list does this.
  least-active-requests reads the router's own in-flight counts but has no prefix term.
  default adds a prefix term but weighs queue depth and KV-cache utilisation, which llm-d's
  router reads from its endpoints' metrics, as normalised scores summed with weights 2, 2 and 3,
  and takes the maximum; Dynamo's cost is in unnormalised block units with the two terms equally
  weighted per block. The sweep behind the other entries shows the policies that read load
  differ from each other by up to 1.70 (balanced) and 1.79 (decode-bound) in median time to first
  token at 64 to 256 clients, default against least-active-requests, so the choice among them
  is not a rounding. It has no prefix shared between requests, which is
  the term this mode exists for, so no bound on a stand-in for it can be measured with it. The
  mode stays unsupported until a composition that carries both terms is hosted and measured on a
  workload with shared prefixes. A run with session affinity configured is a different key and
  has no entry.
