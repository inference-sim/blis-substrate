    path: lib/kv-router/src/scheduling/selector.rs
    lines: "136-143"
    claim: The cost of a worker is overlap_score_weight times its uncached prefill blocks plus its decode blocks, in block units, unnormalised.
  - side: router
    field: policy
    repository: ai-dynamo/dynamo
