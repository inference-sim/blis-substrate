    claim: The defaults are overlap weight 1.0, temperature 0, router-tracked active blocks, router-tracked prefill tokens and a router queue threshold of 4.0.
  - side: llm-d
    field: policy
    repository: inference-sim/llm-d-router
    commit: b1ab0ff7c0b84090e40b874f8873e78f2ae6897c
