# Dynamo's frontend in its random mode. The entry maps it to llm-d's round-robin policy, the
# nearest in the closed list, and measures what the stand-in costs on BLIS: the first group of
# ratios is the ratio between round-robin and llm-d's random picker, the policy that matches
# Dynamo's draw. Every citation is a line of a router's own code at the commit named, or of
# llm-d's router at the commit the module tag v1.0.0-blis.3 of inference-sim/llm-d-router points to.
kind: RouterMapping
router: dynamo
mode: random
revisions:
  - 1682167d3c97f0fc8cd405dee51f17288eeaeb55
policy: round-robin
reason: >-
  Dynamo's random mode and llm-d's round-robin policy both choose a worker without reading load,
  so over a long run each worker gets the same share of requests and neither reacts to a worker
  that falls behind. Dynamo draws a uniform random number for each request and keeps nothing
  between requests; llm-d's policy rotates, so its counts are equal to within one at every
  moment and a random draw's are not. llm-d has a random picker that matches Dynamo's draw
  more closely. It is not in the table's closed list of policies, so the entry maps to the
  nearest policy that is, and the first group of ratios in the bound is what that costs: the
  ratio between round-robin and the random picker on BLIS itself.
difference:
  - aspect: draw
    text: >-
      Dynamo draws a uniform random 64-bit value for each request and takes it modulo the
      number of available instances, with no state (push_router.rs 379-392). llm-d's
      round-robin takes the next value of a counter (picker.go 108-117, common.go 79-87), so
      successive requests go to successive endpoints. Over a window the random draw gives a
      binomial spread of counts across workers and runs of requests to one worker, which the
      rotation does not. BLIS's stand-in is smoother than the mode it stands for.
    evidence: [2, 4, 5]
  - aspect: nearest-composition
    text: >-
      llm-d's random picker shuffles the candidates and takes the first (random/picker.go 94-97)
      and matches Dynamo's draw more closely than the rotation does. The sweep ran it as
      random-picker. It is not in the closed list of policies, so the entry does not map to it;
      the first group of ratios in the bound is the ratio between round-robin and it.
    evidence: [6]
  - aspect: frontends
    text: >-
      Several frontends do not change the mode: independent uniform draws merged are still
      uniform, so Dynamo's mode is the same however many frontends a deployment runs. Nothing
      here differs on that account.
    evidence: [2]
  - aspect: load-blind
    text: >-
      Neither mode reads load, so neither reacts to a worker that falls behind. A policy that
      does (least-active-requests, default, queue-scorer) is not this mode; the second group of
      ratios in the bound is what a wrong guess of the mode would cost.
    evidence: [2, 4]
