# Dynamo's frontend in its random mode, mapped to llm-d's random picker. Every citation is a line
# of a router's own code at the commit named, or of llm-d's router at the commit the module tag
# v1.0.0-blis.3 of inference-sim/llm-d-router points to. The bound is measured on BLIS only: it is
# the sensitivity between the random picker and the alternatives, round-robin first (the other
# policy that ignores load), not an error against Dynamo.
kind: RouterMapping
router: dynamo
mode: random
revisions:
  - 1682167d3c97f0fc8cd405dee51f17288eeaeb55
policy: random-picker
reason: >-
  Dynamo's random mode and llm-d's random picker do the same thing: for each request, draw a
  uniform random index over the available workers, with no state between requests and no reading
  of load. Neither keeps a counter, so unlike round-robin there is no shared counter, no rotation
  and no dependence on the order of the worker list. The remaining differences are the source of
  the randomness and the pools each draw serves, below. How far the choice of policy moves BLIS's
  figures is the bound; the first group of ratios is against round-robin, the other policy that
  ignores load, and the second against the policies that read load.
difference:
  - aspect: draw
    text: >-
      Dynamo draws a random 64-bit value from the thread's generator for each request and takes
      it modulo the number of available instances (push_router.rs 379-392). llm-d's picker
      shuffles the candidates with the hosted runtime's random source and takes the first
      (random/picker.go 94-97, common.go 98-104). Both are uniform over the workers and
      independent between requests. BLIS's source is seeded from the run's seed, so a run is
      reproducible and is one draw of the sequence; Dynamo's is not seeded, and two runs of it
      differ in the sequence even on one arrival pattern.
    evidence: [2, 4, 5]
  - aspect: pools
    text: >-
      Each pool draws on its own in both: Dynamo's prefill and decode routers are separate
      objects (random keeps no counter to share), and llm-d's random picker draws once for each
      pick of each profile. No shared state couples the prefill and decode picks, so the
      counter-per-pool difference of round-robin does not arise here.
    evidence: [2, 4]
  - aspect: frontends
    text: >-
      Several frontends do not change the mode: independent uniform draws merged are still
      uniform, so Dynamo's mode is the same however many frontends a deployment runs. Nothing
      here differs on that account.
    evidence: [2]
  - aspect: load-blind
    text: >-
      Neither reads load, so neither reacts to a worker that falls behind. A policy that does
      (least-active-requests, default, queue-scorer) is not this mode; the second group of
      ratios in the bound is what a wrong guess of the mode would cost.
    evidence: [2, 4]
