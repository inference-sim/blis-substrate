  not_measured:
    - One model (minimax-m2.5) on one part (gb200-nvl72) over NIXL on ib-400g, served by vLLM 0.32.0. Another model or part moves where the pools saturate, and with it where the large ratios sit.
    - Closed-loop clients with fixed prompt and output lengths. No run had a prefix shared between requests, a session of several turns, a spread of lengths, or an open-loop arrival rate.
    - Concurrency 16, 64, 256 and 1024 only, and the pool shapes 1P3D, 2P3D, 3P2D and 4P1D only, with one-GPU prefill instances and four-GPU decode instances. Ratios between the swept points, and larger pools, were not run.
    - The ratios are between policies inside BLIS. No run behind Dynamo was compared with a run of BLIS, so how far Dynamo's real behaviour is from either policy is not measured.
    - Time to first token, at 64 to 256 clients, is where the ratios against the policies that read load are large. The bound does not hold tightly there, and a ranking by TTFT p50 or p99 in that regime should not rest on this substitution. Time per output token and throughput move far less, except at the extremes of concurrency.
evidence:
  - side: router
    field: mode
    repository: ai-dynamo/dynamo
    commit: 1682167d3c97f0fc8cd405dee51f17288eeaeb55
    path: components/src/dynamo/common/configuration/groups/router_args.py
    lines: "66-68"
    claim: The router-mode argument defaults to round-robin, so a run that sets no router mode runs it.
  - side: router
    field: mode
    repository: ai-dynamo/dynamo
    commit: 1682167d3c97f0fc8cd405dee51f17288eeaeb55
    path: lib/runtime/src/pipeline/network/egress/push_router.rs
    lines: "357-372"
    claim: Round-robin takes the next value of the router's counter and selects the instance at that value modulo the number of available instances.
  - side: router
    field: policy
    repository: ai-dynamo/dynamo
    commit: 1682167d3c97f0fc8cd405dee51f17288eeaeb55
    path: lib/runtime/src/pipeline/network/egress/push_router.rs
    lines: "130-131"
    claim: The counter is a field of the router object, so each router keeps its own.
  - side: router
    field: policy
    repository: ai-dynamo/dynamo
    commit: 1682167d3c97f0fc8cd405dee51f17288eeaeb55
    path: lib/runtime/src/component/client.rs
    lines: "166-168"
    claim: The list the counter indexes is the client's available instances, in the order the client holds them.
  - side: router
    field: policy
    repository: ai-dynamo/dynamo
    commit: 1682167d3c97f0fc8cd405dee51f17288eeaeb55
    path: lib/llm/src/kv_router/prefill_router/mod.rs
    lines: "44-49"
    claim: The prefill router is an object of its own, with its own inner router and the router mode it was built with, so the prefill workers have a router object separate from the decode workers'.
  - side: llm-d
    field: policy
    repository: inference-sim/llm-d-router
    commit: b1ab0ff7c0b84090e40b874f8873e78f2ae6897c
    path: pkg/epp/framework/plugins/scheduling/picker/common.go
    lines: "79-87"
    claim: NextCounter returns one monotonically increasing counter.
  - side: llm-d
    field: policy
    repository: inference-sim/llm-d-router
    commit: b1ab0ff7c0b84090e40b874f8873e78f2ae6897c
    path: pkg/epp/framework/plugins/scheduling/picker/common.go
    lines: "98-104"
    claim: RandFor returns one source per hosted runtime, shared by every picker of every profile.
  - side: llm-d
    field: policy
    repository: inference-sim/llm-d-router
    commit: b1ab0ff7c0b84090e40b874f8873e78f2ae6897c
    path: pkg/epp/framework/plugins/scheduling/picker/maxscore/picker.go
    lines: "108-117"
    claim: The max-score picker draws the counter at every pick and rotates each group of tied endpoints by it, so a second profile that picks draws another.
