    repository: ai-dynamo/dynamo
    commit: 1682167d3c97f0fc8cd405dee51f17288eeaeb55
    path: components/src/dynamo/common/configuration/groups/router_args.py
    lines: "66-68"
    claim: The router-mode option, which the frontend adds as its router options, defaults to round-robin, so a run that sets no router mode runs it.
  - side: router
    field: mode
    repository: ai-dynamo/dynamo
    commit: 1682167d3c97f0fc8cd405dee51f17288eeaeb55
    path: lib/runtime/src/pipeline/network/egress/push_router.rs
    lines: "357-372"
    claim: In the build the April 2026 recipes pin, round-robin takes the next value of the router's counter and selects the instance at that value modulo the number of available instances.
  - side: router
    field: policy
    repository: ai-dynamo/dynamo
    commit: 1682167d3c97f0fc8cd405dee51f17288eeaeb55
    path: lib/runtime/src/pipeline/network/egress/push_router.rs
    lines: "130-131"
    claim: The counter is a field of the router object, so each router keeps its own.
  - side: llm-d
