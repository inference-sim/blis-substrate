    path: pkg/epp/framework/plugins/scheduling/picker/common.go
    lines: "98-104"
    claim: RandFor returns one source per hosted runtime, shared by every picker of every profile.
  - side: llm-d
    field: policy
    repository: inference-sim/llm-d-router
    commit: b1ab0ff7c0b84090e40b874f8873e78f2ae6897c
    path: pkg/epp/framework/plugins/scheduling/picker/maxscore/picker.go
    lines: "108-117"
    claim: The max-score picker draws the counter at every pick and rotates each group of tied endpoints by it, so a second profile that picks draws another.
  - side: llm-d
    field: policy
    repository: inference-sim/llm-d-router
    commit: 03246be994224ef031dfdafb966c54f60d01e933
    path: reference-configs/README.md
    lines: "66-93"
    claim: The router has no policy that rotates strictly, one endpoint per request. Round-robin is the max-score picker with no scorer; the candidates reach the picker in a seeded random order in a hosted runtime, so the choice is uniformly random among the tied endpoints, as the random picker's is; tests of pools of two, three and four show near equal counts and no cycle.
