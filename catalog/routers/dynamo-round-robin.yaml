    path: pkg/epp/framework/plugins/scheduling/picker/common.go
    lines: "79-87"
    claim: NextCounter returns one monotonically increasing counter.
  - side: llm-d
    field: policy
    repository: inference-sim/llm-d-router
    commit: b1ab0ff7c0b84090e40b874f8873e78f2ae6897c
    path: pkg/epp/framework/plugins/scheduling/picker/common.go
    lines: "98-104"
    claim: RandFor returns one source per hosted runtime, shared by every picker of every profile.
  - side: llm-d
    field: policy
    repository: inference-sim/llm-d-router
    commit: b1ab0ff7c0b84090e40b874f8873e78f2ae6897c
    path: pkg/epp/framework/plugins/scheduling/picker/maxscore/picker.go
    lines: "108-117"
    claim: The max-score picker draws the counter at every pick and rotates each group of tied endpoints by it, so a second profile that picks draws another.
