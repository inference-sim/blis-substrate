# Dynamo's frontend in its round-robin mode, which it runs when its configuration sets none.
# The entry records that no llm-d policy is close enough, and why. Every citation is a line of the
# router's own code at the one Dynamo build the entry covers (revisions, below), or of llm-d's router
# at the commit the module tag v1.0.0-blis.3 of inference-sim/llm-d-router points to. The entry says
# nothing of any other Dynamo build: a run on one stays router_unsupported until an entry cites it.
kind: RouterMapping
router: dynamo
mode: round-robin
# The build the April 2026 recipes pin (committed 2026-04-26).
revisions:
  - 1682167d3c97f0fc8cd405dee51f17288eeaeb55
policy: none
reason: >-
  llm-d's round-robin policy (a profile with no scorer, so the max-score picker rotates the tied
  endpoints) is a rotation, as Dynamo's mode is, but the two keep their counters in different
  places, and which places decides which endpoint serves which request. Dynamo keeps one
  counter per router object. In the build the recipes pin it is the counter of a PushRouter, one
  per endpoint client in each frontend process (push_router.rs). Every recipe the dashboard read runs several frontends
  (enable_multiple_frontends), so the sequence the workers see interleaves independent rotations.
  llm-d keeps one counter per runtime and draws it at every pick of every profile (common.go,
  picker.go). A run with a prefill and a decode profile, as inference-sim's disaggregating
  configuration has (examples/llm-d/pd.yaml: a max-score-picker in each of the two profiles),
  draws two counters per request, so the prefill profile sees the even counters and the decode
  profile the odd ones. With an even pool size the prefill pool then reaches only the endpoints at
  even shifts (one endpoint of two), and the decode pool only the odd ones. The measured series
  are disaggregated, so the policy would distort which endpoint serves a request in exactly the
  case the table is for. The entry would map to round-robin if the deployment were stated to
  have one frontend and BLIS drew one counter per request for the pool, or kept a counter per
  profile; neither is established. Dynamo's order of workers (instance_ids_avail) is not cited
  either. Until then the mode stays unsupported.
evidence:
