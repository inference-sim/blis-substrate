# Dynamo's frontend in its round-robin mode, which it runs when its configuration sets none.
# The entry records that no llm-d policy is close enough, and why. Every citation is a line of the
# router's own code at the one Dynamo build the entry covers (revisions, below), or of llm-d's router
# at the commit the module tag v1.0.0-blis.3 of inference-sim/llm-d-router points to. The entry says
# nothing of any other Dynamo build: a run on one stays router_unsupported until an entry cites it.
kind: RouterMapping
router: dynamo
mode: round-robin
# The build the April 2026 recipes pin (committed 2026-04-26).
revisions:
  - 1682167d3c97f0fc8cd405dee51f17288eeaeb55
policy: none
reason: >-
  Dynamo's round-robin mode rotates strictly per request: it takes the next value of a counter
  and indexes the list of available instances by it (push_router.rs), so successive requests go
  to successive workers. llm-d's round-robin policy does not: it is the max-score picker with no
  scorer, every endpoint is tied, and the picker chooses among the tied endpoints at random
  (the hosted scheduler shuffles the candidates before each pick, so rotating them by the
  counter is a random choice, as the random picker's is). Tests of the router fork on pools of
  two, three and four endpoints reach every endpoint in near equal counts and not in a cycle
  (pkg/epp/scheduling/scheduler_profile.go 363-370 and picker/maxscore/picker.go 108-117 of
  inference-sim/llm-d-router at commit 03246be994224ef031dfdafb966c54f60d01e933, and the tests
  its reference-configs/README.md describes). These statements are about that router tree and no
  other release; the policy table states none of them. The nearest llm-d policy therefore picks at random among tied endpoints where Dynamo rotates, and the random picker is equally
  close. Whether that is near enough is a measurement of how far the choice of policy moves
  BLIS's figures, which this layer does not carry, so the mode stays unsupported here. Dynamo's
  other structure (a counter per router object, several frontends in every recipe the dashboard
  read, the order of the worker list, which push_router.rs and client.rs show and the code read
  does not fix) is not a difference between the two policies that this entry relies on.
