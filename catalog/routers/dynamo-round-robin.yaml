# Dynamo's frontend in its round-robin mode, which it runs when its configuration sets none.
# The entry maps the mode to llm-d's round-robin policy and says exactly how the two differ and
# how far the choice of policy moves BLIS's figures. Every citation is a line of a router's own
# code at the commit named, or of llm-d's router at the commit the module tag v1.0.0-blis.3 of
# inference-sim/llm-d-router points to. The bound is measured on BLIS only (see the guide
# contracts/guides/router-sensitivity.md); it is a sensitivity, not an error against Dynamo.
kind: RouterMapping
router: dynamo
mode: round-robin
revisions:
  - 1682167d3c97f0fc8cd405dee51f17288eeaeb55
policy: round-robin
reason: >-
  Dynamo's round-robin mode and llm-d's round-robin policy both choose a worker without reading
  load: each takes the next value of a counter and indexes the list of workers by it. Both give
  every worker the same number of requests to within one, and neither reacts to a worker that
  falls behind. They differ in where the counter lives, in how many rotations a deployment runs
  and in the order of the worker list, which the differences below state. How far the choice of
  policy moves BLIS's figures is the bound: small for time per output token and for throughput
  in most of the regime, large for time to first token at 64 to 256 clients when the alternative
  reads load. The first version of this entry held that no policy was close enough, because
  llm-d's shared counter would give a prefill pool of even size every other endpoint. Runs did
  not show it (the pool-balance difference), so the entry maps the mode and keeps the counter
  structure as a stated difference.
difference:
  - aspect: counter-per-pool
    text: >-
      Dynamo's counter is a field of one router object (push_router.rs 130-131), and its
      prefill router is an object of its own with its own inner router (prefill_router/mod.rs 44-49),
      so each pool of workers rotates on its own counter. llm-d keeps one counter for the
      hosted runtime, and the max-score picker draws it at every pick of every profile
      (common.go 98-104, picker.go 108-117), so the prefill pick and the decode pick of one
      request draw two successive values. BLIS has one rotation shared by the pools where Dynamo
      has one for each.
    evidence: [2, 4, 6, 7]
  - aspect: frontends
    text: >-
      A Dynamo deployment can run several frontend processes, each with router objects and
      counters of its own that start at zero, so the sequence of requests a worker sees
      interleaves independent rotations; the recipes the dashboard read run several
      (enable_multiple_frontends). BLIS hosts one router and draws one rotation. Which frontend a request reaches is the load
      balancer's choice and is not modelled.
    evidence: [2]
  - aspect: worker-order
    text: >-
      Dynamo indexes the list of available instances (client.rs 166-168) by the counter modulo
      its length, in the order the client holds the instances, which the code read does not
      fix. llm-d rotates the candidates in the order they reach the picker, and BLIS lists its
      endpoints in identifier order, so a given request need not reach the same worker in the two.
      The number each worker receives agrees to within one.
    evidence: [1, 3, 7]
  - aspect: pool-balance
    text: >-
      Read from the counters above, a prefill pool of even size would see only every other
      endpoint under llm-d's policy. BLIS runs do not show it. With a workload that saturates
      the prefill pool (8,192 prompt tokens, 16 output tokens), round-robin served 25.3 to 27.0
      requests per second at 16 to 1,024 clients with two prefill endpoints, against 27.1 to 27.3
      under least-active-requests and 13.6 with one prefill endpoint; with four it served 46.3 to
      53.3 against 53.6 to 54.4. A pool used through one endpoint would give about half. The
      14 percent gap at four endpoints and 16 clients is also seen under the random picker and
      the default policy, so it is the arrival imbalance of a policy that ignores load, not a
      stuck counter.BLIS does not record which prefill endpoint served a request, so the
      mechanism is not confirmed. The tables are in the guide.
    evidence: [5, 6, 7]
  - aspect: load-blind
    text: >-
      Neither mode reads load, so neither reacts to a worker that falls behind. A policy that
      does (least-active-requests, default, queue-scorer) is not this mode; the second group of
      ratios in the bound is what a wrong guess of the mode would cost.
    evidence: [1, 7]
