    path: lib/llm/src/kv_router/prefill_router/mod.rs
    lines: "44-49"
    claim: The prefill router is an object of its own, with its own inner router and the router mode it was built with, so the prefill workers have a router object separate from the decode workers'.
  - side: llm-d
