  - id: aisimulate
    title: NVIDIA AISimulate operator sweeps (ai-dynamo/aisimulate, aisimulate_core/systems/data)
    revision:
      kind: git_commit
      url: https://github.com/ai-dynamo/aisimulate/tree/2f0f4cd8606d580567b253d02f3d699fe36db865
      ref: 2f0f4cd8606d580567b253d02f3d699fe36db865
    status: >-
      No unit list yet. The sweeps are reachable from CI (registry's rederive.yml checks them out
      at this commit, 1,471 files and 115 MB under systems/data/), but the ingest tool for
      AISimulate is not written; the registry's fitting scripts read the sweeps directly until it
      is.
    # The end-to-end accuracy artifact kernel/scripts/extract_aisimulate_e2e.py reads, pinned to
    # one run (D3). The extractor refuses a summary.json whose SHA-256, run id, attempt, evaluated
    # commit or release tag differs from kernel/scripts/aisimulate_e2e.pin.json, which a test
    # requires to equal this entry. Its predictions are NVIDIA's; its measured relatives come
    # from the InferenceX release db-dump/2026-09-28 (the artifact's measurement_source_url).
    # The run's overall conclusion is failure because two release-branch jobs failed; the job
    # for main, whose artifact this is, succeeded and the summary's campaign status is complete.
    # GitHub keeps the artifact until expires_at, 2026-12-30: a copy of summary.json is
    # authentic if its SHA-256 below matches, so it can be archived anywhere.
    artifacts:
      - id: e2e-accuracy-web
        used_by: kernel/scripts/extract_aisimulate_e2e.py, which turns summary.json into the shape-only per-point corpus (204 sweeps, 1066 points)
        revision:
          kind: workflow_artifact
          url: https://github.com/ai-dynamo/aisimulate/actions/runs/36849388864
          ref: "36849388864"
          run_attempt: 1
          commit: cab77b9c7888b1c40df8cd3228f5e03c355ef23c
          artifact: e2e-accuracy-web-0d6e4079e36703eb
          assets:
