            - {name: summary.json, sha256: e1a380ad7b06ae7f27edc95357e24219f4003e3ed73a3f93ff0dcd192578a3a2}
            - {name: qualification.json, sha256: ed7c5732db912cabb39dd8b1ecc264bbb70f80ebb7bc71d9d5be83cea10bc5c3}
