_comment_interconnect: "IntraNodeBwGBps is the on-package NVLink 3 link as a per-GPU NOMINAL unidirectional bandwidth in GB/s (alias of A100-SXM; same interconnect). vendor_spec (bidirectional / 2), NOT measured effective throughput; any measured correction is a per-cluster blis-registry number. The inter-node fabric figure and the intra:inter ratio it feeds (#1530) live with the reusable Network fabric class (networks/roce-200g.yaml), paired with this chip per deployment (a cluster/pool concept, #1662)."
IntraNodeBwGBps: 300
_comment_sm: "SMCount is the count of enabled Streaming Multiprocessors on the GA100 die as shipped in this part, as NVIDIA publishes it. NVIDIA's A100 datasheet (https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/a100/pdf/nvidia-a100-datasheet-us-nvidia-1758950-r4-web.pdf) gives no SM count, so the sources are NVIDIA's other publications: the NVIDIA A100 Tensor Core GPU Architecture whitepaper (https://images.nvidia.com/aem-dam/en-zz/Solutions/data-center/nvidia-ampere-architecture-whitepaper.pdf), Figure 6, 'GA100 Full GPU with 128 SMs (A100 Tensor Core GPU has 108 SMs)'; and the device-properties dump NVIDIA publishes in its TensorRT cookbook, which records multiProcessorCount = 108 for 'NVIDIA A100-SXM4-80GB' (https://github.com/NVIDIA/trt-samples-for-hackathon-cn/blob/fe36094390a4c9293e0ed398dbb29ac336853ffa/cookbook/90-Misc/DeviceInfo/output/a100-sxm4-80gb.txt). A100 enables 108 of the GA100 die's 128 SMs. The cost model uses SMCount for two things: the per-SM share of peak FLOPs, and the 12-SM derate a Triton-path KV fetch withholds while it overlaps a forward pass (cost model §8.3), which is 9.09% at 132 SMs and 11.11% at 108."
SMCount: 108
_comment_cc: "ComputeCapability is the CUDA compute capability NVIDIA lists for this part (https://developer.nvidia.com/cuda-gpus). A model graph that differs by GPU generation resolves its architecture overlay by the major version, so a chip that states none cannot run such a graph."
ComputeCapability: "8.0"
