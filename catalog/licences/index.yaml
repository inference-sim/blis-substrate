# The licence texts of the committed vendor config.json files (X12).
#
# A model's config.json is committed only when its licence is on the allow-list
# (contracts/vocab, vocab.RedistributableLicences). Every such model whose licence is not
# Apache-2.0, the repository's own licence (LICENSE), has one entry here: its licence, the
# text or texts that licence requires to travel with the file, each with the URL it was read
# from at a pinned revision and its SHA-256, and the attribution sentence the licence
# requires in a notice file, if any. catalog/NOTICE carries those sentences.
#
# validate-catalog fails on a model that needs an entry and has none, on an entry whose
# licence differs from model.yaml's, whose text is missing or hashes differently, whose
# notice sentence is absent from its text or from catalog/NOTICE, or that names no model
# with a committed config.json.

