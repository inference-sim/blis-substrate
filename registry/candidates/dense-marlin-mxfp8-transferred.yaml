# CANDIDATE entries, NOT READ by the lookup: this directory is outside the registry's data
# directories (acceptance, coefficients, routing), so the loader and the validators skip it.
# The h100 dense Marlin W8A16 MXFP8 ramp is recorded here because it has no held-out unit and
# so no verdict (docs/kernel/concepts/hopper-dense-mxfp8-ramp.md); the `assumed` bound in cost-model-primitives.yaml keeps pricing h100.
# WRITTEN by scripts/emit_marlin_dense_transfer.py, which checks it. Do not edit by hand.
coefficients:
  - gemm_eps_max_w8a16_mxfp8:
      value: 0.282
      units: dimensionless
      method: transferred
      fitted: false
      scope: {hardware: [h100]}
      transferred_from: "hardware=h100"
      transfer_rule: "The part's own measured Marlin grouped pair (gemm_eps_max_w4a16_mxfp4_grouped and gemm_m_half_w4a16_mxfp4_grouped, one ramp) is used unchanged as the ramp of the dense Marlin W8A16 MXFP8 GEMM on the same part: same library, same Marlin kernel family and MMA core (FP8 or FP4 weights dequantised in registers, BF16 multiply with mma.sync), same die. The fraction of the BF16 peak and the knee are kept as one pair, never mixed with a number from the other part. No kernel hash is stated for either kernel."
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/moe/vllm/0.25.0/moe_perf.parquet, vllm_compressedtensorsw4a4mxfp4moe_marlin_marlinexperts_situ_as_silu, moe_dtype w4a16_mxfp4, balanced, moe_tp 1 / moe_ep 1, 27 token counts (hidden 3584, inter 3072, top-16 of 896)", role: primary}
        - {kind: model, cite: "vLLM v0.31.0 model_executor/kernels/linear/mxfp8/marlin.py MarlinMxfp8LinearKernel", role: supporting}
      rationale: >
        The asymptotic fraction (0.282) of this part's dense BF16 peak that the dense Marlin W8A16 MXFP8 GEMM is taken to reach, moved from the same part's measured Marlin grouped GEMM (gemm_eps_max_w4a16_mxfp4_grouped; the measured pair is 0.282 of the BF16 peak with a knee of 15 tokens). TRANSFERRED, NOT MEASURED: no sweep has timed MarlinMxfp8LinearKernel on any part. The rule: same Marlin kernel family and MMA core on the same die, so the grouped form's fraction of the BF16 peak and knee are used for the dense form. This replaces the assumed gemm_eps_max_w8a16_mxfp8 (the BF16 envelope, kept in the registry as the named upper bound this entry displaces: a lookup that finds only that entry prices the GEMM at the BF16 peak, as before). The pair is one ramp: the asymptote alone, with the dense knee kept, over-prices decode. VALIDITY: scope is this chip and the dense GEMM of the MXFP8 weight format on SM90 (the name carries the format; the grouped routed term reads the w4a16 names). The entry is unkeyed, because the engine reports no kernel implementation for a GEMM, so no kernel_impls or measured_on can be stated and it does not count as an exact kernel match. The grouped fit covers 27 token counts of one MoE shape and sums its compute and memory halves; whether the dense kernel shares that composition, and whether its ramp holds at other GEMM shapes, is not shown. FITTED NOTHING: no end-to-end result entered this value, and the committed sibling entries are its only input. TO REPLACE IT: a MarlinMxfp8LinearKernel sweep on this part, fitted like fit_marlin_grouped_ramp.py and written as measured with kernel_impls. CANDIDATE, NOT SELECTED: this part has no held-out unit, so the landing criteria give it no verdict; this entry sits outside the registry the lookup reads and the assumed bound prices the GEMM. Reproduce with scripts/emit_marlin_dense_transfer.py.
  - gemm_m_half_w8a16_mxfp8:
      value: 15
      units: tokens
      method: transferred
      fitted: false
      scope: {hardware: [h100]}
      transferred_from: "hardware=h100"
