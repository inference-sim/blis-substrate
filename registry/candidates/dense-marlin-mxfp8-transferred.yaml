      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/moe/vllm/0.25.0/moe_perf.parquet, vllm_compressedtensorsw4a4mxfp4moe_marlin_marlinexperts_situ_as_silu, moe_dtype w4a16_mxfp4, balanced, moe_tp 1 / moe_ep 1, 27 token counts (hidden 3584, inter 3072, top-16 of 896)", role: primary}
        - {kind: model, cite: "vLLM v0.31.0 model_executor/kernels/linear/mxfp8/marlin.py MarlinMxfp8LinearKernel", role: supporting}
      rationale: >
