  - offload_tier_nvme_gen4_raid0_8x_read_rate:
      value: 50000.0
      units: bytes_per_us
      method: assumed
      fitted: false
      scope: {hardware: [h100]}
      sources:
        - {kind: vendor_doc, cite: "NVIDIA DGX H100 user guide and datasheet: 8 x 3.84 TB NVMe U.2 in RAID 0 at /raid (PCIe Gen4); the drive model is not public", role: supporting}
        - {kind: vendor_doc, cite: "NVIDIA DGX SuperPOD H100 reference architecture: '> 50 GB/s' from internal NVMe (a design target, not a measurement)", role: supporting}
        - {kind: publication, cite: "Haas and Leis, VLDB 2023 (high-performance I/O for NVMe storage engines): ~6.5 GB/s measured per Samsung PM1733 under SPDK", role: supporting}
        - {kind: datasheet, cite: "Samsung PM1733 datasheet: 7.0 GB/s sequential read maximum, 3.8 GB/s sequential write; 128 KiB QD1 read 220 us and write 80 us", role: upper_bound}
        - {kind: publication, cite: "Samsung PM1743 white paper: ~1.2-1.5 GB/s per Gen4 drive at queue depth 1 on md RAID 0 (128 KiB splits)", role: supporting}
        - {kind: publication, cite: "FxMark, USENIX ATC 2016: 25-50 us of ext4 create/rename metadata per file", role: supporting}
        - {kind: publication, cite: "XRP, OSDI 2022: ~3 us of O_DIRECT software path", role: supporting}
      rationale: >
        Read 50,000 MB/s: the SuperPOD design target, and 8 x ~6.5 GB/s measured per PM1733 under SPDK (Haas and Leis, VLDB 2023), which sits below 8 x the 7.0 GB/s datasheet maximum. ASSUMED CLASS for a DGX/HGX H100 node's local NVMe data volume: the drive model is not public. NVIDIA's DGX H100 user guide and datasheet state 8 x 3.84 TB NVMe U.2 in RAID 0 at /raid (PCIe Gen4); NVIDIA's DGX SuperPOD H100 reference architecture states '> 50 GB/s' from internal NVMe, which is a design target. These are DEVICE aggregates; TierTime divides them among the transfers in service, so one of vLLM's 16+16 fs threads alone sees the whole rate, which a single O_DIRECT stream does not reach on md RAID 0 (128 KiB splits; ~1.2-1.5 GB/s per Gen4 drive at QD1, Samsung PM1743 white paper): the figure is optimistic at low concurrency. The sources were saved with their provenance under the r2b work's data/external/nvme-* and fsop-* (not redistributed), and no URL was recorded with them. To replace it, run fio on the node's /raid volume at the concurrency vLLM's offload connector uses and fit floor + bytes / rate per direction.
