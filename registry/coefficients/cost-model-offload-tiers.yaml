      rationale: >
        ASSUMED, from a measurement of another call. Formerly the catalog's cpu_dram base_latency_us, a fit and not a device fact. 19.3 us is the mean of the two directions' small-copy floors (19.7 and 18.9 us, median p50 latency at payloads <= 16 KiB, contiguous layout) of vLLM v0.27.1's swap_blocks on an H100 host, used as the fixed cost of one transfer of the path v0.31.0 runs, swap_blocks_batch. The per-call floor does not carry over to that call (a batch of descriptors submitted as one cuMemcpyBatchAsync is not one copy per call), so the figure is a judgement that the two floors are alike and not a measurement of the path priced. It matters for small transfers only: 64 KiB is 1.4 to 2.4 us at the rates and 19.3 us at the floor. To replace it, time swap_blocks_batch on a pinned host buffer over 1 to 16 KiB payloads with the CollectiveX harness at the engine version priced. The measurement it rests on: InferenceX CollectiveX swap_blocks, sku h100-dgxc, image vllm/vllm-openai:v0.27.1, runs 35158674963 and 36334394602 (public InferenceX Data API /api/v1/collectivex/runs/{id}); pinned host memory, contiguous layout.
