  - offload_tier_cpu_dram_read_rate:
      value: 27058.0
      units: bytes_per_us
      method: transferred
      fitted: false
      scope: {hardware: [h100]}
      transferred_from: "hardware=h100"
      transfer_rule: >
        The rows time vLLM v0.27.1's swap_blocks. vLLM v0.27.1 to v0.31.0 changes only a descriptor-chunking loop in swap_blocks_batch (csrc/libtorch_stable/cache_kernels.cu) that is a no-op on CUDA, and v0.31.0's offload issues its copies as one cuMemcpyBatchAsync over the same copy engines, so the large-payload rate is used unchanged as the rate of the path priced. The small-copy floor is not carried over (see offload_tier_cpu_dram_base_latency).
      validated:
        - "held-out random-layout p50 latency, payload >= 1 MiB: median absolute error 0.51 host-to-device and 0.14 device-to-host, against 0.55 and 0.98 for the 2.0e4 MB/s / 1 us placeholder"
      sources:
        - {kind: model, cite: "InferenceX CollectiveX swap_blocks, sku h100-dgxc, image vllm/vllm-openai:v0.27.1, runs 35158674963 and 36334394602 (public InferenceX Data API /api/v1/collectivex/runs/{id}); pinned host memory, contiguous layout", role: primary}
      rationale: >
        The host-to-device payload rate of pinned host memory across an H100 SXM host link, used as the read rate of the cpu_dram tier. Formerly the catalog's cpu_dram read_bandwidth_mb_s, which was a fit to H100 measurements and not a device fact. FIT. Contiguous layout; rate = median payload rate at payloads >= 64 MiB over all block sizes (26 points per direction); floor = median p50 latency at payloads <= 16 KiB. Host-to-device 27,058 MB/s and device-to-host 46,089 MB/s; the two directions' floors are 19.7 and 18.9 us. HELD OUT (random layout, payload >= 1 MiB): the median absolute error of p50 latency is 0.51 host-to-device and 0.14 device-to-host, against 0.55 and 0.98 for the 2.0e4 MB/s / 1 us placeholder it replaced. The data show a per-descriptor cost this form cannot state: at 64 KiB blocks the rate stays near 9-10 GB/s at any count, at 1 MiB blocks it reaches 40-44 GB/s. These are the same rows fit_host_link.py fits for host_link_bandwidth, whose h100 value is the larger of the two rates, so tier and cap are one fit and not two. The run bodies the fit read are no longer served by the API, so the fit cannot be re-derived from public data today (blis-registry#57).
  - offload_tier_cpu_dram_read_rate:
      value: 27058.0
      units: bytes_per_us
      method: transferred
      fitted: false
      scope: {hardware: [a100-80, a100-sxm, b200, b300, gb200-nvl72, gb300, h200, l40s]}
      transferred_from: "hardware=h100"
      transfer_rule: >
        Used unchanged: the rate measured on the H100 host is the only one measured for this tier, and before this entry the catalog applied it to every host without saying so. TierTime then holds the rate to this chip's own measured host_link_bandwidth, so a host whose link is slower than the H100's is priced at its own link. No H200, Blackwell or Grace-Blackwell host has been timed for this tier.
      sources:
        - {kind: model, cite: "InferenceX CollectiveX swap_blocks, sku h100-dgxc, image vllm/vllm-openai:v0.27.1, runs 35158674963 and 36334394602 (public InferenceX Data API /api/v1/collectivex/runs/{id}); pinned host memory, contiguous layout", role: primary}
