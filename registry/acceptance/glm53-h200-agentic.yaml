caveats:
- 'Measured on one workload: inference-perf synthetic_agentic, eight-round sessions with a
  2,048-token shared system prompt, about 2,000 new input tokens and 512 output tokens per
  round, ignore_eos set. Category agentic names that workload; it is not SPEED-Bench''s.'
- 'Source: the reproducibility archive glm53-h200-underpricing-data-20261109.tar.gz (sha256
  2f8dadd0f6c482e47510fa16c6a416e75b5a0622e7a538280a7d41d0ce6d412e) attached to https://github.com/inference-sim/inference-sim/issues/2094.
  validator/testdata/glm53-h200-acceptance/summary.json records the sha256 of every file read
  from it.'
- 'Per-position rates: the engine''s per-position acceptance counters over the 8- and 16-session
  cells, 2952407 verification steps pooled. Spread: tokens per streamed emission across 28445
  requests of the 2-, 8- and 16-session cells (mean 3.204, sd 0.289), net of each request''s
  finite step count and of the 2.4% of steps the load tool merged into the emission before.'
- The 4- and 12-session cells are held out for the accuracy comparison of https://github.com/inference-sim/inference-sim/issues/2094
  and were not read by the fit.
- 'The chain''s per-request random effect is a modelling choice: one normal offset per request
  on the logit of every conditional acceptance probability. It reproduces the spread of per-request
  means, not any finer structure, such as acceptance drifting within a request.'
