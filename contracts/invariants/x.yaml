- id: X8
  section: §4
  title: Every number is reproducible, and no data point both fits and judges.
  statement: >-
    Every number records the exact versions and data it came from, and can be regenerated from them.
    A published number, meaning one on the dashboard or in a committed report, is computed from released
    data only (§3.3). No data point used to fit or choose a value is used to evaluate it (§10).
  scope:
  - accuracy-dashboard
  - blis-config-search
  - blis-sglang
  - blis-substrate
  - blis-vllm
  - inference-sim
  checks:
  - repo: blis-substrate
    check: No ledger unit is cited under two roles by any fit, gate or dashboard point
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: Every data source is pinned to an exact revision
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      Every Result records the module versions, the source and content hash of the catalog and the
      registry, any overlay hashes, and whether the run used released data
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: >-
      The dashboard and committed config-search reports accept only released-data results; an experimental
      result is refused
    runs: pull_request
    status: new
  - repo: blis-config-search
    check: >-
      The dashboard and committed config-search reports accept only released-data results; an experimental
      result is refused
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: Every published number carries its data units
    runs: pull_request
    status: new
  - repo: blis-config-search
    check: Every published number carries its data units
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      Published numbers regenerate: on redistributable fixtures on every pull request, on the full
      data nightly
    runs: pull_request
    status: new
  - repo: blis-config-search
    check: >-
      Published numbers regenerate: on redistributable fixtures on every pull request, on the full
      data nightly
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: >-
      Published numbers regenerate: on redistributable fixtures on every pull request, on the full
      data nightly
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      An accuracy change's success criteria are committed before any commit that reads its held-out
      data
    runs: pull_request
    status: new
