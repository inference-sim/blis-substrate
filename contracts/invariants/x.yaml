# The X invariants: Rules that span repositories, and process rules (BLIS target design §4 and §4.1).
#
# One record per invariant, in the format of design §13.1. This file is the source of truth:
# the design's appendix, each repository's AGENTS.md section, the pull-request checklist and
# the release plan's status table are generated from it (go run ./tools/invariants render).
# Edit a record here, never a rendered copy. contracts/invariants/doc.go describes every field.

- id: X1
  section: §4
  title: Users configure BLIS with the upstream's own configuration.
  statement: >-
    What a user would hand llm-d, vLLM or SGLang is what they hand BLIS, in the upstream's own field
    names, types, defaults and errors. BLIS adds only what the real system learns from its environment:
    hardware, cluster topology and workload. Engine repositories resolve defaults exactly as the upstream
    does. The router needs no port of its defaults: the fork runs llm-d's own flag parsing, configuration
    loader and Kubernetes decoding unchanged, so a value the real router rejects is rejected with
    the router's own message. An unknown or unsupported field is refused by its upstream name, never
    ignored. The one exception is the router's flags that only change how a deployed router is served
    or observed (transport, TLS, leader election, ports, telemetry). Those are accepted, have no effect,
    and are named in a warning.
  scope:
  - blis-sglang
  - blis-substrate
  - blis-vllm
  - inference-sim
  - llm-d-router
  checks:
  - repo: blis-vllm
    check: >-
      Every configuration field of the pinned release is classified as modelled, proven inert, or
      not modelled (VLM-3, SGL-3)
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: >-
      Every configuration field of the pinned release is classified as modelled, proven inert, or
      not modelled (VLM-3, SGL-3)
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: >-
      An unknown field, or a not-modelled field set away from its default, is refused with its upstream
      name
    runs: pull_request
    status: ci
    test: 'rules/engineconfig: TestDecodeRefusesAnUnknownKey'
  - repo: blis-sglang
    check: >-
      An unknown field, or a not-modelled field set away from its default, is refused with its upstream
      name
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: >-
      Defaults match: the upstream's own configuration code resolves each oracle scenario, and the
      port's values are compared field by field
    runs: pull_request
    status: ci
    test: 'ci.yml job packs-against-vllm: rules/v0_32 -run MatchSource'
  - repo: blis-sglang
    check: >-
      Defaults match: the upstream's own configuration code resolves each oracle scenario, and the
      port's values are compared field by field
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: >-
      Every configuration the upstream rejects is rejected. This is tested on a generated set: each
      field's boundary values, taken from the upstream's own argument and validation metadata, and
      one case for each branch of the upstream's validation code, with branch coverage required
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: >-
      Every configuration the upstream rejects is rejected. This is tested on a generated set: each
      field's boundary values, taken from the upstream's own argument and validation metadata, and
      one case for each branch of the upstream's validation code, with branch coverage required
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      The scenario's router flags, configuration file and manifests reach the router unchanged, and
      the router parses them with its own code
    runs: pull_request
    status: ci
    test: 'cmd: TestScenarioRouterInputs_MapsTheRouterBlock'
  - repo: llm-d-router
    check: >-
      A set of malformed router flags, configuration files and manifests is refused, each with llm-d's
      own error message
    runs: pull_request
    status: ci
    test: 'pkg/embed: TestNewRefusals'
  - repo: llm-d-router
    check: >-
      Every flag in the router's flag set either is on the fork's list of flags that only matter in
      a cluster, or can change a decision. Every plugin type llm-d registers either is on the fork's
      list of audited types, or is refused by name. Both lists are regenerated against each new llm-d
      release and reviewed as a diff
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      Every scenario key outside the engine and router blocks is on a fixed list of environment facts
    runs: pull_request
    status: new
  review:
  - question: >-
      Does this new scenario field describe something the real system would observe, rather than a
      setting the upstream does not have?
    reviewer: contracts owners
    when: a key is added to the environment list
    trigger:
      repos:
      - blis-substrate
      paths:
      - contracts/spec/scenario/**
  - question: >-
      Does this router flag only change how a deployed router is served or observed, with no effect
      on any routing, admission or flow-control decision?
    reviewer: router fork owners
    when: a flag is added to the fork's list of flags that only matter in a cluster
    trigger:
      repos:
      - llm-d-router
      paths:
      - pkg/embed/config.go
  status: partial
  target:
    status: ci
    milestone: 4
  note: >-
    the engine-setting flags that restate scenario fields are removed only in M4; the router fork
    parses router inputs with llm-d's own strict code; its inert-flag and audited-plugin lists are
    not yet checked against upstream
- id: X2
  section: §4
  title: The substrate knows no engine.
  statement: >-
    Outside its tests, blis-substrate contains no engine name, no engine version and no engine's policy.
    Engine behaviour reaches it only as a resolved PoolPlan, StepShape or Transfer.
  scope:
  - blis-substrate
  - inference-sim
  checks:
  - repo: blis-substrate
    check: >-
      No engine identifier in non-test Go identifiers, string literals or registry keys: engine names,
      engine version strings, upstream source-path citations, and engine-only setting names. The word
      list is committed in the substrate (invariants/engine-words.txt). A bot regenerates it from
      each engine release's field list in a pull request, leaving out words the architecture vocabulary
      also uses, such as dtype or quantization. The count per directory may only go down, measured
      against the word list of the same version, until it reaches zero
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      The cost model's public functions accept only plans, step shapes, transfers, and catalog and
      registry handles
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      PoolPlan, StepShape and Transfer contain no field whose values come from an engine's vocabulary,
      and a zero value means "absent" or the field's documented neutral value (such as stage 0), never
      an engine default (a reflection test). Separately, a scenario both engines support is priced
      from each engine's plan, and every price difference is traced to a named difference between
      the plans
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: Coefficient scope keys come from a fixed set with no engine key
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: Model graphs use only architecture vocabulary
    runs: pull_request
    status: new
  review:
  - question: >-
      Does this change hide one engine's policy (a default, threshold, backend choice or padding rule)
      behind a neutral name? Would the other engine need the same edit?
    reviewer: owners of the changed directory
    when: any non-test change under catalog/, registry/ or kernel/
    trigger:
      repos:
      - blis-substrate
      paths:
      - catalog/**
      - registry/**
      - kernel/**
      exclude:
      - '**/*_test.go'
      - '**/testdata/**'
      - '**/tests/**'
  status: new
  target:
    status: ci
    milestone: 4
- id: X3
  section: §4
  title: Engine behaviour lives only in its engine repository.
  statement: >-
    Scheduling, KV management, KV connectors and tiering decisions, default resolution, and lowering
    a model to kernel implementations belong to blis-vllm or blis-sglang. Each engine repository models
    one upstream release at a time (LIF-5).
  scope:
  - blis-sglang
  - blis-substrate
  - blis-vllm
  - inference-sim
  checks:
  - repo: blis-substrate
    check: The cost model imports no engine module
    runs: pull_request
    status: ci
    test: 'kernel: TestTheLibraryImportsNoEngineModel'
  - repo: blis-vllm
    check: No engine module imports another
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: No engine module imports another
    runs: pull_request
    status: new
  - repo: inference-sim
    check: The simulator reaches engines only through engine.Engine, at one build site
    runs: pull_request
    status: ci
    test: 'cmd: TestTheBinaryReachesBlisVLLMOnlyThroughTheBuildSite'
  - repo: inference-sim
    check: Scheduler and KV types exist only in engine modules
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: Scheduler and KV types exist only in engine modules
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      The simulator does no resource arithmetic (KV blocks, bytes, tier capacities); it asks the engine
      or the cost model. The one exception is dividing a link's bandwidth among transfers and the
      cross-domain traffic of step collectives that overlap in time (SIM-13) (§6.2)
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: Every ported file names the release that the repository's Upstream record names
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: Every ported file names the release that the repository's Upstream record names
    runs: pull_request
    status: new
  review:
  - question: >-
      Is engine behaviour, such as scheduling, admission or KV accounting, being added to the simulator
      instead of an engine repository?
    reviewer: inference-sim owners
    when: a change to the simulator's request-lifecycle or capacity code
    trigger:
      repos:
      - inference-sim
      paths:
      - sim/engine_driver*.go
      - sim/instance_state.go
      - sim/request.go
      - sim/event_queue.go
      - sim/engine_records.go
      - sim/dp_modes.go
      - sim/cluster/**
      exclude:
      - '**/*_test.go'
  status: partial
  target:
    status: ci
    milestone: 4
- id: X4
  section: §4
  title: The router is llm-d's own router code, unchanged.
  statement: >-
    The fork changes only how the router is hosted: how it reads time, starts work, draws random numbers
    and makes calls. It changes no routing decision. Engine-specific router behaviour comes from llm-d's
    own code for that engine.
  scope:
  - inference-sim
  - llm-d-router
  checks:
  - repo: llm-d-router
    check: >-
      No new clock, timer, goroutine, randomness, map-order or network call on a decision path, except
      through the fork's runtime interface; every change to an upstream file is of an allowed kind
      (RTR-2), and every hosting hazard is converted or reviewed (RTR-6)
    runs: pull_request
    status: ci
    test: 'hosting-lint.yml job hosting: go run ./hack/hosting-lint'
  - repo: llm-d-router
    check: >-
      The fork, run under its default runtime, and the upstream release it is based on make the same
      decisions on recorded request streams. Because the fork keeps upstream's module path, one program
      cannot load both, so the upstream release is built separately and each build replays the same
      recorded requests. A decision that depends on a random draw or on map order is compared as a
      set: the fork's choice must be one the upstream can make. Upstream's own tests also run on the
      fork, changed only as RTR-2 allows
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      Under BLIS's simulated runtime, every decision is one the default runtime can make from the
      same recorded state. Each decision is replayed from the recorded state just before it, not from
      the simulation's own history, so one different tie-break cannot make every later decision incomparable.
      Ties and random draws are compared as sets of the choices the upstream could make
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      BLIS imports only the fork's pkg/embed.New, and only audited plugin types are reachable
    runs: pull_request
    status: ci
    test: 'sim/llmd: TestRouterImportsOnlyTheEmbedConstructor'
  - repo: llm-d-router
    check: >-
      Every branch the fork takes only when hosted is exercised by a test that compares it with the
      upstream code it replaces
    runs: pull_request
    status: new
  review:
  - question: >-
      Does this change to how the router is hosted keep upstream behaviour on paths the recorded streams
      do not cover, such as errors, timeouts and cancellation?
    reviewer: fork owners
    when: a fork pull request converts a call site or updates the lint baseline
    trigger:
      repos:
      - llm-d-router
      paths:
      - hack/hosting-lint/baseline.txt
      - hack/hosting-lint/budget.txt
      - pkg/**/*.go
      - cmd/epp/**/*.go
      exclude:
      - '**/*_test.go'
  status: partial
  target:
    status: ci
    milestone: 3
- id: X5
  section: §4
  title: Fidelity is proven by comparing against the upstream's own code.
  statement: >-
    Each engine repository runs the upstream's own Python code on the same inputs and compares its
    decisions with the Go port's, step by step. Only the environment is replaced (GPU, clock, transport,
    environment settings, the hardware platform and outside services), and every replacement is listed
    in a manifest (§7).
  scope:
  - blis-sglang
  - blis-vllm
  checks:
  - repo: blis-vllm
    check: >-
      Every replacement the test harness makes is listed in the manifest; a changed manifest carries
      a new version
    runs: pull_request
    status: ci
    test: oracle/check_mocks.py oracle/mocks.json
  - repo: blis-sglang
    check: >-
      Every replacement the test harness makes is listed in the manifest; a changed manifest carries
      a new version
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: Decisions match on every recorded scenario
    runs: pull_request
    status: ci
    test: 'core/sched: TestDifferentialAgainstVLLM'
  - repo: blis-sglang
    check: Decisions match on every recorded scenario
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: A recorded trace's decisions change only in a commit marked as reviewed
    runs: pull_request
    status: ci
    test: oracle/check_goldens.py
  - repo: blis-sglang
    check: A recorded trace's decisions change only in a commit marked as reviewed
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: >-
      Every ported function is exercised by some recorded scenario, and deliberately broken copies
      of it are caught
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: >-
      Every ported function is exercised by some recorded scenario, and deliberately broken copies
      of it are caught
    runs: pull_request
    status: new
  review:
  - question: >-
      Does this new replacement stand in only for the GPU, clock, transport, environment settings,
      the hardware platform or an outside service, and not for a decision? If it reproduces a decision,
      is it declared as a transcription?
    reviewer: engine repository owners
    when: the manifest changes
    trigger:
      repos:
      - blis-vllm
      - blis-sglang
      paths:
      - oracle/mocks.json
  status: partial
  target:
    status: ci
    milestone: 3
  note: oracle diff tests in blis-vllm only
- id: X6
  section: §4
  title: Same inputs, same output.
  statement: >-
    For fixed scenario bytes, seed, module versions, Go toolchain version and catalog and registry
    content hashes, the simulator's standard output is identical byte for byte across runs, thread
    counts and supported platforms. The data source (embedded or path) is recorded in the Result,
    but is left out of the output the byte gate compares. Simulated time is passed in as a number,
    and no code reads the system clock. Randomness comes from named substreams seeded from the scenario
    (DEV-6).
  scope:
  - blis-sglang
  - blis-substrate
  - blis-vllm
  - inference-sim
  - llm-d-router
  checks:
  - repo: inference-sim
    check: >-
      Identical output across runs and thread counts; a recorded trace replays identically
    runs: pull_request
    status: ci
    test: 'sim/llmd: TestDeterminism_AcrossProcesses'
  - repo: inference-sim
    check: >-
      Identical output on linux/amd64, linux/arm64 and darwin/arm64: nightly, and on every pull request
      that changes kernel/ or an engine's lowering. Two things differ by platform. First, the Go compiler
      may fuse x*y+z into one fused multiply-add on some architectures and not others, which changes
      the last bits; so cost-model and engine code writes float64(x*y) + z where fusion must not happen,
      or calls math.FMA where it must. Second, some functions in Go's math package, such as Exp and
      Log, use assembly or CPU-dependent code on some platforms, so their last bits can differ between
      machines; cost-model and engine code calls the pure-Go copies in contracts/check/fmath instead,
      which use no fused multiply-add. A lint enforces both rules. stack.json records the toolchain
      version (SIM-3)
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: No clock reads and no goroutines in engine or cost-model code
    runs: pull_request
    status: ci
    test: TestNoClockNoGoroutines
  - repo: blis-sglang
    check: No clock reads and no goroutines in engine or cost-model code
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: No clock reads and no goroutines in engine or cost-model code
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      No unsorted map iteration on an output path, and no unnamed randomness. In the router fork this
      lint covers files the fork wrote; upstream code is covered by the differential test in X4
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: >-
      No unsorted map iteration on an output path, and no unnamed randomness. In the router fork this
      lint covers files the fork wrote; upstream code is covered by the differential test in X4
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: >-
      No unsorted map iteration on an output path, and no unnamed randomness. In the router fork this
      lint covers files the fork wrote; upstream code is covered by the differential test in X4
    runs: pull_request
    status: new
  - repo: llm-d-router
    check: >-
      No unsorted map iteration on an output path, and no unnamed randomness. In the router fork this
      lint covers files the fork wrote; upstream code is covered by the differential test in X4
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      No unsorted map iteration on an output path, and no unnamed randomness. In the router fork this
      lint covers files the fork wrote; upstream code is covered by the differential test in X4
    runs: pull_request
    status: new
  review:
  - question: Could this floating-point reduction give a different result on another platform?
    reviewer: owners of the changed repository
    when: >-
      a parallel or floating-point reduction is added, or the cross-platform check fails
    trigger:
      manual: true
  status: partial
  target:
    status: ci
    milestone: 3
- id: X7
  section: §4
  title: One owner for each fact; dependencies point one way.
  statement: >-
    Contracts live in blis-substrate/contracts. A repository never imports one above it in Figure
    1. A generated file is written only by its generator. Every copy of a fact is generated from its
    owner or checked against it. The dashboard's scoring harness is the one thing a lower repository
    uses from a repository above it: it runs the harness as a pinned, released tool, never imports
    its code. A lower repository's candidate job may also build inference-sim through stack CI to
    run that harness (§13.5).
  scope:
  - accuracy-dashboard
  - blis-config-search
  - blis-sglang
  - blis-substrate
  - blis-vllm
  - inference-sim
  - llm-d-router
