- id: X13
  section: §4.1
  statement: >-
    Every behaviour change has a test that fails without it. A validation change (§8.9) to a published
    number carries success criteria fixed in advance, plus held-out evidence. A verification change
    that moves published numbers, such as a fidelity fix, carries the price-change report and the
    scoring harness's figures on published units, and is never rejected for exposing an error elsewhere
    (VAL-11). A refactor shows identical output on the byte gate and on the dashboard's corpus: the
    recorded configuration of every ledger unit the dashboard can simulate, re-run through the scoring
    harness, with no measured value read. That corpus covers shapes the byte gate does not. Each nightly
    run of the whole corpus records which functions each point reaches. A pull request then runs every
    point that reaches a function it changes, in parallel; with no such record for its base, it runs
    the whole corpus. The whole corpus also runs before every release. A pull request that is both
    a refactor and a behaviour change is split.
