- id: X11
  section: §4.1
  statement: >-
    Pins are exact release tags. The only committed replace directive is the one in inference-sim's
    go.mod that substitutes the router fork for upstream llm-d. It exists because the fork keeps upstream's
    module path (github.com/llm-d/llm-d-router), so Go cannot fetch the fork by its own path; a replace
    is Go's only way to substitute it. It names the fork's exact -blis.N tag, never a branch or a
    local path, so it pins as exactly as a require does, and go.sum records its hash. It may appear
    only in inference-sim, because Go ignores replace directives in every module but the one being
    built. No other module requires the fork; engines and other repositories use only the router contract
    in contracts/embed. The only committed exclude directives are those in inference-sim that skip
    a plain tag made before the rule of §14.1, and no repository commits a go.work file.
