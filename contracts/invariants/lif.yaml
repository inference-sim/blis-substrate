- id: LIF-2
  section: §14.2
  statement: >-
    In every build, each BLIS module resolves to the exact version the release records in stack.json,
    and the router fork resolves to a -blis.N tag through inference-sim's one replace directive (X11).
    inference-sim's own substrate requirement equals the version its build selects, so no engine or
    router release can change the simulator's data. One Go toolchain version is named in contracts/toolchain,
    at the substrate version inference-sim selects. No module BLIS writes declares a go version above
    it. Every CI job sets GOTOOLCHAIN=local and installs exactly that version, so no build downloads
    a toolchain. The router fork's go line follows upstream llm-d; when upstream raises it, the release
    bot raises the toolchain file first, in the same review set. Documented version strings are generated
    (X23).
  scope:
  - blis-sglang
  - blis-substrate
  - blis-vllm
  - inference-sim
  - llm-d-router
  checks:
  - repo: blis-substrate
    check: >-
      Selected-version lint (go list -m all), which for the router reads the replace target that go
      list -m -json reports, not the placeholder version on the require line
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: >-
      Selected-version lint (go list -m all), which for the router reads the replace target that go
      list -m -json reports, not the placeholder version on the require line
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: >-
      Selected-version lint (go list -m all), which for the router reads the replace target that go
      list -m -json reports, not the placeholder version on the require line
    runs: pull_request
    status: new
  - repo: llm-d-router
    check: >-
      Selected-version lint (go list -m all), which for the router reads the replace target that go
      list -m -json reports, not the placeholder version on the require line
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      Selected-version lint (go list -m all), which for the router reads the replace target that go
      list -m -json reports, not the placeholder version on the require line
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      A check that every module in go list -m -json all declares a GoVersion no higher than contracts/toolchain
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: >-
      A check that every module in go list -m -json all declares a GoVersion no higher than contracts/toolchain
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: >-
      A check that every module in go list -m -json all declares a GoVersion no higher than contracts/toolchain
    runs: pull_request
    status: new
  - repo: llm-d-router
    check: >-
      A check that every module in go list -m -json all declares a GoVersion no higher than contracts/toolchain
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      A check that every module in go list -m -json all declares a GoVersion no higher than contracts/toolchain
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: A CI step that fails if go version differs from it
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: A CI step that fails if go version differs from it
    runs: pull_request
