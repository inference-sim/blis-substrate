# The SUB invariants: blis-substrate (BLIS target design §5).
#
# One record per invariant, in the format of design §13.1. This file is the source of truth:
# the design's appendix, each repository's AGENTS.md section, the pull-request checklist and
# the release plan's status table are generated from it (go run ./tools/invariants render).
# Edit a record here, never a rendered copy. contracts/invariants/doc.go describes every field.

- id: SUB-1
  section: §5
  statement: >-
    Packages under contracts/ import only the Go standard library, the YAML parser and each other.
    Between contract-change review sets they change only compatibly: an interface never gains a method,
    optional abilities are separate interfaces, and new fields keep their zero-value meaning. An incompatible
    change is allowed only as a contract-change review set (§12.8), which releases every implementer
    against it together. From v1 on such a set raises the substrate's MAJOR version. While the substrate
    is at v0 it raises MINOR, because Go treats every v0 version as one major. contracts/harness and
    contracts/conformance may also use golang.org/x/tools, at the version blis-substrate's go.mod
    requires, for their analysis checks.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: Import test
    runs: pull_request
    status: ci
    test: 'contracts: TestKernelImportsOnlySpec'
  - repo: blis-substrate
    check: >-
      API-compatibility check of the contracts/ packages against the last substrate tag
    runs: pull_request
    status: new
  review: null
  status: partial
  target:
    status: ci
    milestone: 2
- id: SUB-2
  section: §5
  statement: >-
    Every new or changed data field ships with its validator, a failing example for each way it can
    be wrong, and regenerated reference documentation.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: Documentation-matches-types test
    runs: pull_request
    status: ci
    test: 'contracts: TestDocFieldTablesMatchTypes'
  - repo: blis-substrate
    check: Strict loaders
    runs: pull_request
    status: ci
    test: 'contracts: TestLoadRejectsUnknownFields'
  - repo: blis-substrate
    check: Examples must validate
    runs: pull_request
    status: ci
    test: 'contracts: TestDocExamplesValidate'
  review: null
  status: ci
  target:
    status: ci
    milestone: null
- id: SUB-3
  section: §5
  statement: >-
    The catalog holds declared facts only: figures read from a published source, each with a citation
    a reader can follow. Each model's graph is generated from its vendor config.json and the safetensors
    headers of its checkpoint, and never edited by hand. No runtime code reads config.json. No model
    value is hard-coded in the cost model or an engine, and no setting asks the user to copy a value
    from a checkpoint.
  scope:
  - blis-sglang
  - blis-substrate
  - blis-vllm
  checks:
  - repo: blis-substrate
    check: Deriver --check
    runs: pull_request
    status: ci
    test: catalog/scripts/derive_graph.py --check
  - repo: blis-substrate
    check: The validators
    runs: pull_request
    status: ci
    test: go run ./validate/cmd/validate-catalog catalog
  - repo: blis-substrate
    check: >-
      The packaging check and its test pair: a scenario's gpus_per_node or gpus_per_rack that
      contradicts the chip's catalog entry, a missing gpus_per_node on a chip that states none, and a
      gpus_per_rack on a chip with no rack tier are refused, each beside the closest accepted cluster
    runs: pull_request
    status: ci
    test: 'contracts/spec/scenario: TestPackagingRefusals'
    known_bad: 'contracts/spec/scenario: TestPackagingRefusals'
  - repo: blis-substrate
    check: A test that no runtime package opens config.json
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      A lint for model-name literals in kernel/ and in engine lowering code. Review: that each citation
      supports its figure
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: >-
      A lint for model-name literals in kernel/ and in engine lowering code. Review: that each citation
      supports its figure
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: >-
      A lint for model-name literals in kernel/ and in engine lowering code. Review: that each citation
      supports its figure
    runs: pull_request
    status: new
  review: null
  status: partial
  target:
    status: ci
    milestone: 4
- id: SUB-4
  section: §5
  statement: >-
    Every coefficient is generated by its family's writer script, never edited by hand. It records
    its value, units, scope, method, sources and data units (§9).
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: Writers --check on fixtures per pull request, on full data nightly
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: Provenance rules
    runs: pull_request
    status: ci
    test: go run ./validate/cmd/validate-registry registry
  review: null
  status: partial
  target:
    status: ci
    milestone: 1
- id: SUB-5
  section: §5
  statement: >-
    Coefficients obey physics: no compute rate above the chip's dense datasheet peak for that data
    type; no memory bandwidth above the datasheet peak for a working set larger than the chip's L2
    cache; at a fixed algorithm, topology tier and bytes per rank, a collective never gets faster
    as the group grows.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: >-
      Property tests: no compute rate above the dense datasheet peak, and a collective never gets
      faster as the group grows
    runs: pull_request
    status: ci
    test: registry/validator/test_coefficient_properties.py
  - repo: blis-substrate
    check: 'Property tests: the per-data-type peak and the L2-bounded memory bandwidth'
    runs: pull_request
    status: new
  review: null
  status: partial
  target:
    status: ci
    milestone: 2
  note: property tests exist; the per-data-type and L2-bounded checks are new
- id: SUB-6
  section: §5
  statement: >-
    The cost model resolves nothing. Every default, backend choice, padding and capture decision arrives
    in the plan or the step shape.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: >-
      A test that the cost model's public functions accept only plans, step shapes, transfers, and
      catalog and registry handles
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 4
- id: SUB-7
  section: §5
  statement: >-
    The cost model has a price for every primitive it can be asked about. When no fitted coefficient
    exists it uses the next source in a fixed order, and records which one it used (§9).
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: Completeness test over every primitive and every catalog chip
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 2
- id: SUB-8
  section: §5
  statement: >-
    A change to the substrate never breaks the data it releases: validators, deriver and writers all
    pass on the tree being released.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: The validators run on every pull request
    runs: pull_request
    status: ci
    test: ci.yml jobs catalog, registry
  - repo: blis-substrate
    check: The graph deriver --check runs on every pull request
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      Every registry writer --check runs on every pull request, on redistributable fixtures
    runs: pull_request
    status: new
  review: null
  status: partial
  target:
    status: ci
    milestone: 1
  note: validators run on every pull request; deriver and writer runs are new
- id: SUB-9
  section: §5
  statement: >-
    Data is loaded the same way from a path or from the embedded copy: the same file patterns, the
    same validators (including the checks between catalog and registry), and the same content hash.
    The embedded patterns equal the loader's patterns.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: >-
      A test that loads the embedded copy and an exported checkout of the same commit, and gets identical
      data and an identical hash
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: A test comparing the two pattern lists
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 1
- id: SUB-10
  section: §5
  statement: >-
    contracts/conformance includes a set of unusual model shapes: every layer windowed, every layer
    recurrent, MLA only, a draft layer declared last, a single layer, and no attention at all. Every
    engine and the cost model either runs each one or refuses it with the upstream's reason. No size
    or price may be non-finite or zero where a positive value is required.
  scope:
  - blis-sglang
  - blis-substrate
  - blis-vllm
  checks:
  - repo: blis-substrate
    check: The conformance suite, run in blis-substrate, blis-vllm and blis-sglang
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: The conformance suite, run in blis-substrate, blis-vllm and blis-sglang
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: The conformance suite, run in blis-substrate, blis-vllm and blis-sglang
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 2
- id: SUB-11
  section: §5
  statement: >-
    Every field of PoolPlan, StepShape and Transfer, and every coefficient family, changes some price
    when it is changed, or is listed as not yet priced with an issue. A setting that the engine resolves
    but the cost model never reads is a gap, and it is visible.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: A perturbation test in kernel/
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: A ratchet on the not-yet-priced list, which may only shrink
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 2
- id: SUB-12
  section: §5
  statement: >-
    Every loader of a BLIS document refuses unknown keys, duplicate keys, numbers that do not convert
    exactly, non-finite numbers and recursive aliases. Every declared field is either used or refused,
    never dropped.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: Each loader refuses unknown keys
    runs: pull_request
    status: ci
    test: 'contracts: TestLoadRejectsUnknownFields'
  - repo: blis-substrate
    check: >-
      A shared set of malformed documents in contracts/conformance, run against every loader
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: A test that every declared field is read
    runs: pull_request
    status: new
  review: null
  status: partial
  target:
    status: ci
    milestone: 2
- id: SUB-13
  section: §5
  statement: >-
    blis-substrate is one Go module: no go.mod exists below the repository root, and the files in
    the module zip that Go fetches total under 100 MB uncompressed (Go's limit is 500 MB).
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: A check that fails on any nested go.mod
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: A check of that uncompressed total
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 1
- id: SUB-14
  section: §5
  statement: >-
    The memory breakdown closes. Every figure an engine's upstream reports about memory at start-up
    (weights, memory outside PyTorch's allocator, peak activations, the CUDA-graph pool, and the memory
    left for KV) has one matching term, within a stated tolerance. Buffers and workspaces the engine
    chooses are PoolPlan fields, sized by the engine as its upstream sizes them. Memory the engine
    does not choose, such as the CUDA context and communication libraries, is a measured coefficient
    per chip and library version. Anything left over is a named term on a list that may only shrink,
    never folded into another term. Each term states its basis: per rank, per node or for the group
    (SUB-16). Host memory closes the same way: the weights an engine keeps in host memory, its host
    KV tier and its pinned buffers are PoolPlan figures. Each states whether the engines on a node
    share it; a shared figure counts once per node. For each node, the sum fits the catalog's host
    memory.
  scope:
  - blis-sglang
  - blis-substrate
  - blis-vllm
  - inference-sim
  checks:
  - repo: blis-vllm
    check: >-
      In each engine repository, oracle tier T3 against the upstream's own buffer-sizing functions
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: >-
      In each engine repository, oracle tier T3 against the upstream's own buffer-sizing functions
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      In blis-substrate's error job, a comparison of the total with recorded GPU start-up logs, which
      are ledger units with role validate
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      A start-up refusal in inference-sim when a node's host-memory figures exceed its host memory
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 2
- id: SUB-15
  section: §5
  statement: >-
    A model graph holds only what the checkpoint states: the tensors, their shapes and stored data
    types, scale tensors, and the layer structure. Every graph field can be computed from config.json
    and the safetensors header of every checkpoint shard (the header only, no tensor data). How an
    engine shards, fuses, pads or repacks a tensor, which page size it uses, and which nodes it emits
    under a layout are lowering, and belong to the engine (X3). The engine reports the resident weights
    that result in its PoolPlan.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: A test that rederives every graph field from those inputs
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      A check that graph vocabulary has no emit conditions. The deriver records each header's SHA-256
      and the revision, under the same licence rule as config.json (X12)
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 4
  note: graphs carry emit conditions and engine sharing choices
- id: SUB-16
  section: §5
  statement: >-
    Quantities carry units as types. Bytes, seconds, tokens, FLOPs, bytes per second and dimensionless
    ratios are distinct Go types in contracts/, and so are per-rank, per-node and per-group amounts,
    so adding a byte count to a token count, or a per-rank amount to a per-group one, does not compile.
    A registry entry's unit equals the unit the formula reading it requires, checked when the registry
    loads. An efficiency lies in (0, 1]. A quantised format is one type (payload bits, scale bits,
    block shape) with one function for its stored bytes.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: The compiler
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: A load-time unit check in the cost model
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: >-
      Validator rules that catalog peaks are dense figures and that their ratios between data types
      match the datasheet. The bounds on rates are SUB-5's
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 2
- id: SUB-17
  section: §5
  statement: >-
    A transfer or collective names its endpoints by rank, and the cost model prices it over the path
    between them through the catalog's links: the NVLink domain, the NIC and each switch tier. A collective's
    step time is set by the cost model. A collective that leaves its NVLink domain also reports the
    demand it places on each link during the step; that demand is reserved, and transfers share what
    remains.
  scope:
  - blis-substrate
  - inference-sim
  checks:
  - repo: blis-substrate
    check: A property test over random placements, in blis-substrate
    runs: pull_request
    status: new
  - repo: inference-sim
    check: The link-capacity test of SIM-13
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 3
  note: placements name nodes, not ranks or NICs
- id: SUB-18
  section: §5
  statement: >-
    Provenance is recorded per field, not per file. A catalog field holds a datasheet figure, a published
    figure, or a measurement of one named device, and says which. A fitted or assumed value is a coefficient,
    and belongs in the registry.
  scope:
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: Validator rules on catalog provenance fields
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 2
- id: SUB-19
  section: §5
  statement: >-
    Every document that crosses a repository boundary has one definition, in contracts/spec: the scenario,
    the deployment, the Result, and the per-point record the scoring harness writes. Each substrate
    release publishes them as JSON Schema, generated from the Go types. blis-config-search and accuracy-dashboard
    validate every document they read or write with inference-sim schema validate, which runs the
    Go validators (X15), and define none of their own. The published JSON Schema serves editors and
    structural checks. The per-point record is defined there too, although the dashboard writes it,
    because config search and the substrate's gates read it.
  scope:
  - accuracy-dashboard
  - blis-config-search
  - blis-substrate
  checks:
  - repo: blis-substrate
    check: A generator test in blis-substrate that the published schemas match the Go types
    runs: pull_request
    status: new
  - repo: blis-config-search
    check: Schema validation in the applications' CI
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: Schema validation in the applications' CI
    runs: pull_request
    status: new
  - repo: blis-config-search
    check: >-
      A lint in the applications that refuses a hand-written schema for these documents
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: >-
      A lint in the applications that refuses a hand-written schema for these documents
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 1
  note: >-
    the scenario and Result types exist in blis-schemas (#15); the applications define their own schemas
- id: SUB-20
  section: §5
  statement: >-
    No price, size or engine decision depends on a free-text label. Every property a consumer branches
    on, such as which attention node in the model graph reads a cache the plan sizes or whether an
    expert group is shared or routed, is a typed field with a closed set of values, derived from the
    checkpoint and checked at load. Names and roles kept for people to read change no output.
  scope:
  - blis-sglang
  - blis-substrate
  - blis-vllm
  checks:
  - repo: blis-substrate
    check: >-
      A syntax-tree lint in blis-substrate and each engine repository that refuses a comparison on
      a documentation-only string field outside tests
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: >-
      A syntax-tree lint in blis-substrate and each engine repository that refuses a comparison on
      a documentation-only string field outside tests
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: >-
      A syntax-tree lint in blis-substrate and each engine repository that refuses a comparison on
      a documentation-only string field outside tests
    runs: pull_request
    status: new
  - repo: blis-substrate
    check: A perturbation test (SUB-11) that changing such a label changes no price
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 2
