# The COV invariants: Accuracy coverage (BLIS target design §11.8).
#
# One record per invariant, in the format of design §13.1. This file is the source of truth:
# the design's appendix, each repository's AGENTS.md section, the pull-request checklist and
# the release plan's status table are generated from it (go run ./tools/invariants render).
# Edit a record here, never a rendered copy. contracts/invariants/doc.go describes every field.

- id: COV-1
  section: §11.8
  statement: >-
    One scorer produces every number, and it lives only in accuracy-dashboard: no other repository
    compares a simulation with a measured end-to-end benchmark. Every anchor unit is either graded
    G1 to G4 or listed as G5 with a reason, and the counts sum to the total.
  scope:
  - accuracy-dashboard
  - blis-config-search
  - blis-sglang
  - blis-substrate
  - blis-vllm
  - inference-sim
  - llm-d-router
  checks:
  - repo: accuracy-dashboard
    check: Summary tests in the dashboard
    runs: pull_request
    status: ci
    test: orchestrator/test_build_summary.py
  - repo: blis-substrate
    check: >-
      A lint that refuses code outside accuracy-dashboard that reads end-to-end benchmark units to
      compute an error
    runs: pull_request
    status: new
  - repo: blis-vllm
    check: >-
      A lint that refuses code outside accuracy-dashboard that reads end-to-end benchmark units to
      compute an error
    runs: pull_request
    status: new
  - repo: blis-sglang
    check: >-
      A lint that refuses code outside accuracy-dashboard that reads end-to-end benchmark units to
      compute an error
    runs: pull_request
    status: new
  - repo: llm-d-router
    check: >-
      A lint that refuses code outside accuracy-dashboard that reads end-to-end benchmark units to
      compute an error
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      A lint that refuses code outside accuracy-dashboard that reads end-to-end benchmark units to
      compute an error
    runs: pull_request
    status: new
  - repo: blis-config-search
    check: >-
      A lint that refuses code outside accuracy-dashboard that reads end-to-end benchmark units to
      compute an error
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: >-
      A lint that refuses code outside accuracy-dashboard that reads end-to-end benchmark units to
      compute an error
    runs: pull_request
    status: new
  review: null
  status: partial
  target:
    status: ci
    milestone: 1
  note: >-
    the dashboard has the per-point scorer; blis-registry, inference-sim and blis-vllm also score
