    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 1
- id: COV-10
  section: §11.8
  statement: >-
    The dashboard copies the run's whole experimental frame (§8.6), not only its engine block: client
    concurrency, warm-up, drain, duration and the measured-window rule. The requests are the ones
    the run sent (COV-12), so BLIS's own substreams (DEV-6) draw only what the run's requests do not
    fix, such as a router's tie-breaks, and replications (DEV-11) cover those draws. A frame field
    the run did not record makes the point G5 with the reason value_not_recorded (§11.4); no default
    is substituted. The achieved concurrency in the simulation matches the measured one within a stated
    tolerance. Each lane is scored on its percentiles and a distribution distance, not only on its
    mean. A simulated figure compared with a measurement carries its replication interval, or states
    that the run has no random input (§8.4); its uncertainty is then the measurement's own noise (below)
    and the model's (§8.8). Where InferenceX has several units whose identifying fields differ only
    in measured date or benchmark run, and whose recorded image digests agree, or one such unit holding
    several measurements (§10.2), their spread is reported as the measurement's own noise, and no
    point's error is counted for a difference smaller than that noise. Units whose image digests differ
    or are unrecorded are not pooled for noise, because their builds may differ. A unit holding several
    measurements is scored against their mean.
  scope:
  - accuracy-dashboard
  checks:
  - repo: accuracy-dashboard
    check: A check that every scored scenario's frame equals the recorded one
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: A concurrency check per point
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: The summary schema
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 3
- id: COV-11
  section: §11.8
  statement: >-
    The headline accuracy covers every graded point, G1 to G4. Beside it, the dashboard publishes
    the share of points in each grade and each grade's own accuracy. Every published figure shows
    its point count, and a figure over fewer points than the minimum stated in the dashboard's summary
    schema is shown as "too few points".
  scope:
  - accuracy-dashboard
  checks:
  - repo: accuracy-dashboard
    check: The summary schema, which requires a count with every figure
    runs: pull_request
    status: ci
    test: orchestrator/validate_summary.py
  - repo: accuracy-dashboard
    check: A publish check that refuses a figure under the minimum count
    runs: pull_request
    status: new
  review: null
  status: partial
  target:
    status: ci
    milestone: 1
  note: >-
    the dashboard headlines all scored points; the per-grade shares and point counts are new
- id: COV-12
  section: §11.8
  statement: >-
    The scored simulation receives the requests the measured run sent: the same requests, in the same
    order, with the same prompt lengths, output lengths and shared prefixes. Their arrival times follow
    the simulated completions by the client's own rules (§8.5). Where the client draws its requests
    from a seeded generator, the dashboard recomputes them with the client's own algorithm and seed,
    at the client release the run records; where the run records none, at the release its image ships,
    and the point names it. Prompt lengths are counted after the client's tokenisation and verified
    against the run's tokenizer at a pinned revision. An output length is the length the client forced
    or, where it forced none, the length the run's response records (DEV-13); where neither is recorded,
    the length is drawn from the frame's input model, and the point names it. The simulator runs the
    client's warm-up, so the measured phase starts from the engine state the warm-up left, such as
    cached prefixes. Every difference between the run's client and the simulated one, including an
    unrecorded client release or an unverified length, is named on the point and makes it G2.
  scope:
  - accuracy-dashboard
  - inference-sim
  checks:
  - repo: accuracy-dashboard
    check: >-
      A test that recomputes every scored point's request lengths with an independent implementation
      of the client's generator and compares them with the replayed trace
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: >-
      A test per client release that its pinned source still draws as the dashboard recomputes
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: A check that every scored point's trace has the run's request count and order
    runs: pull_request
    status: new
  - repo: inference-sim
    check: >-
      The single-turn recomputation of the client's seed-0 lengths and the sent-length check, in inference-sim's
      tools/harness, until they move into the dashboard's harness
    runs: pull_request
    status: ci
    test: 'tools/harness: TestEveryMeasuredOrResolvedPointSentItsTarget'
  review: null
  status: partial
  target:
    status: ci
    milestone: 3
  note: >-
    M1 moves the single-turn recomputation of the client's seed-0 lengths, the sent-length check and
    the warm-up priming from inference-sim's tools/harness into the dashboard's harness; agentic-trace
    requests follow in M3
