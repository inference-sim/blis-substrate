    Only ledger anchor units are scored, using the simulator release's embedded data and the anchor
    list embedded in its substrate release (inference-sim ledger).
  scope:
  - accuracy-dashboard
  checks:
  - repo: accuracy-dashboard
    check: >-
      A scorer check that every scored point is an anchor unit from the release's embedded anchor
      list
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 1
- id: COV-3
  section: §11.8
  statement: >-
    The dashboard copies recorded configuration verbatim, and reads field status and estimation rules
    only from the engine's fields.json.
  scope:
  - accuracy-dashboard
  checks:
  - repo: accuracy-dashboard
    check: A check that the dashboard holds no settings table
    runs: pull_request
    status: new
  - repo: accuracy-dashboard
    check: >-
      A check that every scenario's engine block equals, field for field, the values the run passed,
      parsed with the engine's own argument parser, or the resolved value where only that is recorded
      (§11.2). The exceptions are engine.version, which equals the release in stack.json, and each
      field an estimation rule set, which the point names
    runs: pull_request
    status: new
  review: null
  status: new
  target:
    status: ci
    milestone: 1
