<title id="fig-repos-title">The BLIS repositories and the contracts</title>
<desc id="fig-repos-desc">blis-substrate is one Go module with five directories. kernel/ and validate/ import the contracts/ packages; kernel/ reads catalog/ and registry/, and validate/ checks them. blis-vllm, blis-sglang and the llm-d router fork import only the contracts/ packages. inference-sim imports the whole substrate module, each engine and the router fork.</desc>
<defs>

<marker id="repos-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-accent" d="M0,1 L9,5 L0,9 z"/></marker>
</defs>

<figcaption>Who imports what. The engine repositories and the router fork import only the packages under <code>contracts/</code>, so a coefficient or pricing change needs no engine or router release. inference-sim imports the whole substrate module, each engine and the router fork. The packages under <code>contracts/</code> import only the Go standard library, the YAML parser and each other.</figcaption>
