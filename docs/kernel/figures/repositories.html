<title id="fig-repos-title">Where the kernel sits in blis-substrate</title>
<desc id="fig-repos-desc">Inside blis-substrate, kernel/ imports the contracts/ packages for document types, loaders, validators and the Kernel interface. It reads model graphs, chips, fabrics and storage tiers from catalog/, and coefficient sets from registry/, as files. inference-sim imports the kernel and calls it once per simulated step. Nothing imports in the other direction.</desc>
