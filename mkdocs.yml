site_name: blis-substrate
site_description: >-
  The engine-independent foundation of BLIS: the contracts every BLIS repository implements
  or calls, the catalog of published hardware and model facts, the registry of fitted
  coefficients, and the cost model that prices each engine step.
site_url: https://inference-sim.github.io/blis-substrate/
repo_url: https://github.com/inference-sim/blis-substrate
repo_name: inference-sim/blis-substrate
edit_uri: edit/main/docs/
copyright: Apache 2.0 · part of <a href="https://github.com/inference-sim">BLIS</a>

# Included into pages by the snippets extension, not rendered on their own.
exclude_docs: |
  contracts/examples/
  contracts/figures/
  contracts/generated/
  kernel/figures/
  kernel/generated/
  includes/
  hooks/
  overrides/
  requirements.txt

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tooltips
    - content.action.edit
    - toc.follow

# The catalog's reference pages and the registry's set pages are generated from the
# committed data at build time; each hook's module docstring says how.
hooks:
  - docs/hooks/catalog_pages.py
  - docs/hooks/registry.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # Paths in a snippet are relative to the repository root, so a page can include a
      # committed example, a catalog file or a Go example by its real path.
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
      auto_append: ["docs/includes/abbreviations.md"]

plugins:
  - search
  # Every version's pages name the latest release's copy as canonical, so search engines
  # index one version rather than all of them.
  - mike:
      canonical_version: latest

extra:
  version:
    provider: mike
    default: latest
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/inference-sim/blis-substrate

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

