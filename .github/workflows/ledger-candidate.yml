name: ledger candidate

# The candidate half of every operator-level scoring run (design §10.2, D7). It runs the pull
# request's code with no secret, no environment and a read-only token. It is handed every unit
# not on the published fit, anchor and report lists, predicts each with no network, and
# uploads one file, predictions.json (ledger.Predictions, at most 64 MB). ledger.yml's select,
# error and gate jobs read that file from main, in the environment that holds the seed.
#
# It runs on a pull request that changes the registry or the cost model. Its predictions
# decide nothing until a seed-holding job reduces them.

on:
  pull_request:
    paths:
      - registry/**
      - kernel/**
      - catalog/**
  # GitHub applies no paths filter to merge_group; the `changes` job below decides.
  merge_group:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # GitHub applies no paths filter to merge_group, so this workflow starts for every queue
  # entry. This cheap job decides whether the heavy job has anything to check: on a merge
  # group it compares base_sha..head_sha with this file's own pull_request paths (read from
  # this file by prcheck, never copied); on every other event it says run. When no path
  # changed the heavy job is skipped and the workflow concludes success, so the merge check
  # can require a successful run of it at the merge-queue commit (X17, X22).
  changes:
    name: ledger-candidate changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go-toolchain
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "merge_group" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          go run ./tools/prcheck gate-changed -workflow .github/workflows/ledger-candidate.yml -base "$BASE" -head "$HEAD" >> "$GITHUB_OUTPUT"

  candidate:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-toolchain
      # Fetch every module first; the prediction itself runs with no network.
      - run: go mod download && go build -o "$RUNNER_TEMP/ledger" ./ledger/cmd/ledger
      - run: '"$RUNNER_TEMP/ledger" candidate-units -out "$RUNNER_TEMP/units.json" catalog/ledger'
      - name: Predict, with no network
        env:
          # The pull request's head commit, which is the run's head_sha. GITHUB_SHA is the
          # merge commit on a pull_request run, and the seed-holding job compares this field
          # with the run's head_sha (X22).
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # The operator-level predictor is the cost model's own (kernel/). Until it exists for
          # InferenceX units, this step records each unit as not predicted, so the shape of the
          # run is in place and a seed-holding job decides nothing from it.
          # No network: a new network namespace with no interface but loopback. The step fails
          # if the namespace cannot be made; it never falls back to running with the network.
          sudo unshare --net -- sudo -u "$USER" env PATH="$PATH" \
            python3 -I - "$RUNNER_TEMP/units.json" "$RUNNER_TEMP/predictions.json" "$HEAD_SHA" <<'EOF'
          import json, sys
          units = json.load(open(sys.argv[1]))
          out = {"kind": "Predictions", "candidate": sys.argv[3],
                 "predictions": [{"source": u["source"], "unit_id": u["unit_id"],
                                  "reason": "no operator-level predictor for this source"} for u in units]}
          json.dump(out, open(sys.argv[2], "w"))
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: predictions
          path: ${{ runner.temp }}/predictions.json
          retention-days: 7
