name: rederive

# The re-derivation gates, with the data present.
#
# `validate.yml`'s derivation-tests job runs validator/ without the AISimulate sweeps, so
# test_generated_from_aisimulate.py and test_writers_are_idempotent.py skip there: a pull
# request that hand-edits a fitted value, or changes a writer, was caught only if its
# author ran them locally (inference-sim/blis-registry#36). This job checks out AISimulate
# at the commit every committed value re-derives at and runs the whole suite
# (scripts/rederive.sh), so a value that its own fitter no longer produces fails.
#
# The InferenceX CollectiveX run bodies the GB200 / H200-EP16 DeepEP entries cite are fetched
# from the public API and checked against pinned sha256s (scripts/fetch_cited_inferencex.py);
# they are third-party data, so they are fetched, never committed (X12, D6). The tests whose
# cited bodies the API no longer serves skip, and are on .github/quarantine.yaml with an
# owning issue and an expiry; rederive.sh fails on any other skip (X16, X25).
#
# It runs nightly on the full data (SUB-4, SUB-8), on every pull request that changes the
# registry's coefficients, scripts or tests, and by hand. The checkout is ~135 MB and the
# gates take ~20 minutes, which a pull request touching those paths pays. It is a gate: its
# trigger paths are declared below and in .github/gates.yaml, and the nightly status page
# shows it failing when its last real run is more than seven days old (X16).
#
# gate-paths: registry/coefficients/**, registry/scripts/**, registry/validator/**, .github/workflows/rederive.yml, .github/quarantine.yaml

on:
  pull_request:
    paths:
      - registry/coefficients/**
      - registry/scripts/**
      - registry/validator/**
      - .github/workflows/rederive.yml
      - .github/quarantine.yaml
  # A merge-queue entry runs the cheap `changes` job; the ~20-minute job runs only when the
  # entry changes one of the paths above (GitHub applies no paths filter to merge_group).
  merge_group:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub applies no paths filter to merge_group, so this workflow starts for every queue
  # entry. This cheap job decides whether the heavy job has anything to check: on a merge
  # group it compares base_sha..head_sha with this file's own pull_request paths (read from
  # this file by prcheck, never copied); on every other event it says run. When no path
  # changed the heavy job is skipped and the workflow concludes success, so the merge check
  # can require a successful run of it at the merge-queue commit (X17, X22).
  changes:
    name: rederive changes
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go-toolchain
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "merge_group" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          go run ./tools/prcheck gate-changed -workflow .github/workflows/rederive.yml -base "$BASE" -head "$HEAD" >> "$GITHUB_OUTPUT"

  rederive:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      # The AISimulate commit the committed values re-derive at. Pinned by SHA because the
      # repository's history moves; bump it deliberately, together with the diff the
      # writers produce at the new commit (docs/reproducing-coefficients.md).
      AISIMULATE_SHA: 2f0f4cd8606d580567b253d02f3d699fe36db865
      # A second AISimulate commit, for one family: the h100/h200 fp16 all-reduce triples on
      # vLLM 0.31.0's custom all-reduce (scripts/relane_allreduce_vllm.py), a sweep the main
      # pin predates. Moving AISIMULATE_SHA itself would refit every family at once.
      AISIMULATE_ALLREDUCE_SHA: 7980e9500c00d9f85d7f296451d12768a743c70e
      # The InferenceX commit validator/testdata/inferencex vendors the golden acceptance
      # curves from (VENDORED.md), and INFERENCEX_SHA in emit_acceptance_profiles.py.
      INFERENCEX_SHA: 9fa76586ed1ef66caadc6b95a9b1448acde94c6b
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The whole aisimulate_core package (~135 MB): the sweeps under systems/, the model
      # configs fit_deepseek_v41_h200.py asserts geometry from, and the sdk/ source
      # emit_memory.py reads NVIDIA's activation table out of. A narrower checkout once
      # left sdk/ out and failed the memory writer.
      - name: Check out AISimulate (pinned, the aisimulate_core package only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ai-dynamo/aisimulate
          ref: ${{ env.AISIMULATE_SHA }}
          path: aisimulate
          fetch-depth: 1
          sparse-checkout: |
            python/aisimulate/src/aisimulate_core

      - name: Check out AISimulate at the all-reduce pin (h100/h200 comm only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ai-dynamo/aisimulate
          ref: ${{ env.AISIMULATE_ALLREDUCE_SHA }}
          path: aisimulate-allreduce
          fetch-depth: 1
          sparse-checkout: |
            python/aisimulate/src/aisimulate_core/systems/data/h100_sxm/comm
            python/aisimulate/src/aisimulate_core/systems/data/h200_sxm/comm

      - name: Check out InferenceX (pinned to the vendored commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SemiAnalysisAI/InferenceX
          ref: ${{ env.INFERENCEX_SHA }}
          path: inferencex
          fetch-depth: 1
          sparse-checkout: |
            inferencex-e2e/infx/golden_al_distribution

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: registry/scripts/requirements-fit.txt

      - name: Install the fitters' dependencies
        run: pip install --require-hashes -r registry/scripts/requirements-fit.txt

      # tools/prcheck reads the skips against the quarantine list.
      - uses: ./.github/actions/go-toolchain

      # Fails, naming the run, if a pinned body is no longer served or differs from its hash.
      - name: Fetch the cited CollectiveX run bodies (sha256-pinned)
        working-directory: registry
        run: python -I scripts/fetch_cited_inferencex.py "$RUNNER_TEMP/collectivex"

      - name: Run every gate with the data present
        env:
          AISIMULATE_DATA: ${{ github.workspace }}/aisimulate/python/aisimulate/src/aisimulate_core/systems/data
          BLIS_CATALOG: ${{ github.workspace }}/catalog
          AISIMULATE_ALLREDUCE_DATA: ${{ github.workspace }}/aisimulate-allreduce/python/aisimulate/src/aisimulate_core/systems/data
          INFERENCEX_GOLDEN: ${{ github.workspace }}/inferencex/inferencex-e2e/infx/golden_al_distribution
          COLLECTIVEX_DATA: ${{ runner.temp }}/collectivex
        working-directory: registry
        run: scripts/rederive.sh
