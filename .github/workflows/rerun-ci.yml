name: rerun on runner shutdown (this repository)

# This repository's use of rerun-on-runner-shutdown.yml, called by path, at the default-branch commit
# that started it (never the pull request's code). See that file for the rule: one rerun, only for the
# runner-shutdown signature, never silent.

on:
  workflow_run:
    workflows: [ci, ci-light]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    permissions:
      actions: write
      pull-requests: write
      checks: read
      contents: read
    uses: ./.github/workflows/rerun-on-runner-shutdown.yml
    with:
      run-id: ${{ github.event.workflow_run.id }}
      substrate-ref: ${{ github.sha }}
