name: rerun on runner shutdown

# The only automatic rerun in BLIS CI. A hosted runner that is shut down under a job ends it
# with "The runner has received a shutdown signal" (exit code 143): the infrastructure's
# failure, not the change's, and a rerun of the same commit is its only remedy. This workflow
# reruns the failed jobs of a failed run ONCE, and only when
#
#   - the run is on its first attempt (a second failure is never rerun), and
#   - every failed job carries a failure annotation with the shutdown message (one job failed
#     for any other reason, such as a test, a lint or a gate, and nothing is rerun).
#
# It is never silent: the job summary says whether it reran and why, and a pull request gets a
# comment when it did. Nothing else reruns automatically, because a retry hides a flaky test;
# `blis` (the X14 and X24 checks) is never listed in a caller, so its result is always the
# run's own. The decision is prcheck's DecideRerun, with known-bad cases in its tests.
#
# GitHub starts a workflow_run workflow only from the default branch, and a reusable workflow
# cannot declare the trigger, so a repository adds a thin caller (by commit, X21):
#
#   name: rerun on runner shutdown
#   on:
#     workflow_run:
#       workflows: [CI]            # the names of the repository's CI workflows
#       types: [completed]
#   permissions: {}
#   jobs:
#     rerun:
#       if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
#       permissions:
#         actions: write
#         pull-requests: write
#         checks: read
#         contents: read
#       uses: inference-sim/blis-substrate/.github/workflows/rerun-on-runner-shutdown.yml@<40-hex commit>
#       with:
#         run-id: ${{ github.event.workflow_run.id }}
#         substrate-ref: <the same commit>
#
# The job runs no code of the pull request: it builds prcheck from blis-substrate at
# substrate-ref and calls the API.

on:
  workflow_call:
    inputs:
      run-id:
        description: The id of the completed workflow run.
        type: number
        required: true
      substrate-ref:
        description: The blis-substrate commit this workflow is called at.
        type: string
        required: true

permissions:
  actions: write
  pull-requests: write
  checks: read
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  rerun:
    name: rerun once on runner shutdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out blis-substrate at the called commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inference-sim/blis-substrate
          ref: ${{ inputs.substrate-ref }}
          path: substrate
      - uses: ./substrate/.github/actions/go-toolchain
        with:
          module-dir: substrate
      - name: Decide, rerun once if the runner was shut down, and say so
        working-directory: substrate
        run: go run ./tools/prcheck rerun -repo "${{ github.repository }}" -run "${{ inputs.run-id }}"
