name: ci

# One workflow for the whole repository, with a job per directory (design §3.4). Each job runs
# when its own paths change. The cross-directory checks run on every change, because catching
# a mismatch between directories is why the four repositories became one: the validators run
# against the data, and the cost model against the data it embeds.
#
# Every action is pinned by commit (X21). The comment beside each pin names its release.

on:
  pull_request:
  # The required check also runs on the merge-queue tree, which is the tree a CI verdict
  # judges (X22).
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No build downloads a toolchain: every Go job installs exactly contracts/toolchain (LIF-2).
env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed directories
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      kernel: ${{ steps.filter.outputs.kernel }}
      catalog: ${{ steps.filter.outputs.catalog }}
      ledger: ${{ steps.filter.outputs.ledger }}
      registry: ${{ steps.filter.outputs.registry }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          # On a push with no usable base, or a manual run, every job runs.
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            for k in contracts kernel catalog ledger registry docs; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          has() { if printf '%s\n' "$changed" | grep -Eq "$1"; then echo true; else echo false; fi; }
          # A change to go.mod, go.sum, the workflow or the root package affects every Go job.
          shared='^(go\.mod|go\.sum|[^/]+\.go|\.github/)'
          # Any Python file can restate a Go rule, so a Python change runs the X15 lint here. The
          # loader (load/) reads the catalog and the registry, so a data change runs it too.
          echo "contracts=$(has "$shared|^contracts/|^validate/|^tools/|^load/|^catalog/|^registry/|\.py$")" >> "$GITHUB_OUTPUT"
          echo "kernel=$(has "$shared|^kernel/|^contracts/|^load/|^validate/")" >> "$GITHUB_OUTPUT"
          echo "catalog=$(has "$shared|^catalog/")"                      >> "$GITHUB_OUTPUT"
          echo "ledger=$(has "$shared|^catalog/ledger/|^ledger/")"       >> "$GITHUB_OUTPUT"
          echo "registry=$(has "$shared|^registry/")"                    >> "$GITHUB_OUTPUT"
          echo "docs=$(has "$shared|^docs/|^mkdocs\.yml|^catalog/|^registry/|^contracts/example_test\.go")" >> "$GITHUB_OUTPUT"

  # Formatting, vet and build for the whole module, on every change. They are fast, and a
  # change in one directory can break the build of another.
  go:
    name: format, vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      # The selected-version lint (X11, LIF-2): replace and exclude directives, no go.work,
      # every module's go directive at or below contracts/toolchain, and go version equal
      # to it.
      - run: go run ./tools/modlint
      # The root package's tests: one module, no nested go.mod, and the module zip under
      # 100 MB (SUB-13).
      - run: go test -count=1 .

  # golangci-lint over the Go packages (contracts, kernel, validate, tools, load, ledger and the
  # root), with the default linters and .golangci.yml (X17). It lints changed code only: the
  # existing code has findings that are listed in .golangci.yml, and a new one fails here. The
  # binary is built with contracts/toolchain, since a prebuilt one is built with an older Go
  # and refuses a newer module.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-toolchain
      - name: Build golangci-lint v2.14.0
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint what the change touches
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          # With no usable base (a manual run, a new branch), lint what the last commit changed.
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          rev="$(git merge-base "$BASE" HEAD)"
          # The migration pull request is based on a main that holds none of the migrated code,
          # so "changed since the merge base" would be the whole repository. The baseline is the
          # commit that introduced this job (the findings the migrated code already had are
          # listed in .golangci.yml); a later change is judged against its own base, which has
          # that commit as an ancestor.
          intro="$(git log --diff-filter=A --format=%H -1 -- .golangci.yml)"
          if [ -n "$intro" ] && ! git merge-base --is-ancestor "$intro" "$rev"; then rev="$intro"; fi
          "$RUNNER_TEMP/bin/golangci-lint" run --new-from-rev="$rev" ./...

  contracts:
    name: contracts and validators
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The source-comparison tests re-derive constants from the upstream code they cite.
      # Each checkout is pinned to the commit of the release the test names, and the
      # *_SOURCE_REQUIRED variables make a missing checkout a failure, not a skip (X16).
      - name: Check out vLLM v0.31.0 (the files the contracts tests read)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vllm-project/vllm
          ref: db9527a46873454610df6dbedf79a36d6bf1a7f6 # v0.31.0
          path: upstream/vllm
          sparse-checkout: |
            vllm/v1/worker
            vllm/config
      - name: Check out aiperf v0.12.0 (the files the workload tests read)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ai-dynamo/aiperf
          ref: be53bf2953d30e46c500e6a80fc1f8b6f84bc718 # v0.12.0
          path: upstream/aiperf
          sparse-checkout: |
            src/aiperf
      - uses: ./.github/actions/go-toolchain
      - name: Tests, with every skip reported
        env:
          VLLM_SOURCE: ${{ github.workspace }}/upstream/vllm
          VLLM_SOURCE_REQUIRED: "1"
          AIPERF_SOURCE: ${{ github.workspace }}/upstream/aiperf/src/aiperf
          AIPERF_SOURCE_REQUIRED: "1"
        run: |
          set -euo pipefail
          go test -race -count=1 -json ./contracts/... ./validate/... ./tools/... ./load/... > "$RUNNER_TEMP/go-test.json" || { go run ./tools/prcheck skips -results "$RUNNER_TEMP/go-test.json" -min 1000; exit 1; }
          # A skipped test is a failure unless quarantined (X16, X25); fewer than 1000
          # results means packages were not run (X22).
          go run ./tools/prcheck skips -results "$RUNNER_TEMP/go-test.json" -min 1000
      # Python code that restates a Go rule (X15). TestPythonRuleLint above runs it too;
      # the step names the command.
      - name: Python rule lint (X15)
        run: |
          set -euo pipefail
          go run ./tools/prcheck vocab > "$RUNNER_TEMP/vocab.json"
          python3 -I tools/pyrules/pyrules.py "$RUNNER_TEMP/vocab.json"
      # The AGENTS.md block, the pull-request template and the rendered index match the
      # invariant registry (design §13.1). The test above also checks this; the step names
      # the command that fixes it.
      - run: go run ./tools/invariants render -check

  kernel:
    name: cost model
    needs: changes
    if: needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      # The scoring suite needs measurement corpora this repository does not distribute, so it
      # is compiled and vetted here but not run.
      - run: go vet -tags scoring ./kernel/...
      - run: go test -count=1 -timeout 30m ./kernel/...
      # The race detector reports races between goroutines, and the one place the cost model
      # starts any is the concurrency test: a kernel is safe to call from many goroutines.
      - run: go test -race -count=1 -run TestStepTimeIsPureAndSafeUnderConcurrency ./kernel/
      - name: Python script tests that need no corpus
        run: |
          python3 kernel/scripts/test_extract_inferencex_engine_settings.py
          python3 kernel/scripts/test_gen_aisimulate_scenarios.py

  # The mutation check (X13) for the cost model's guarded properties: kernel/mutation_test.go
  # breaks each in turn, in the source, with go test -overlay, and requires the test that guards
  # it to fail. A property with a surviving mutant is a property no test pins. It is also the
  # known-bad input of this check (X18). The sweep covers the listed properties, not every
  # changed function; widening it is a row in that file.
  mutants:
    name: mutation check
    needs: changes
    if: needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - run: go test -count=1 -v -run '^TestGuardedPropertiesKillTheirMutants$' ./kernel/

  # Every catalog entry validates, and every model graph is what the deriver produces from
  # its vendor configuration. The validator is this repository's own, so the catalog and the
  # code that reads it are checked at the same commit.
  catalog:
    name: catalog
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - run: go run ./validate/cmd/validate-catalog catalog
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r catalog/scripts/requirements-dev.txt
      - name: Every graph re-derives from its vendor configuration
        working-directory: catalog
        run: python3 scripts/derive_graph.py --check
      - name: The deriver's tests
        working-directory: catalog
        run: python3 -m pytest tests -q

  # The data ledger (design §10.2): the committed files load and pass their checks (D3), no
  # tracked file lists roles (D4), every unit at the merge base keeps its unit_id and role key
  # or is aliased (D4), and the seed-holding workflows hold the seed only from main (D7).
  # The byte-for-byte regeneration from the pinned dump needs the 34 GB dump, so it runs in
  # ledger.yml's nightly job, not here.
  ledger:
    name: ledger
    needs: changes
    if: needs.changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-toolchain
      - run: go test -count=1 ./ledger/...
      - run: go run ./ledger/cmd/ledger check catalog/ledger
      - run: go run ./ledger/cmd/ledger scan-roles .
      - run: go run ./ledger/cmd/ledger lint-workflows .github/workflows
      - name: Against the ledger at the merge base (D4)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE" HEAD)
          if ! git cat-file -e "$base:catalog/ledger/ledger.yaml" 2>/dev/null; then
            echo "the merge base has no ledger; nothing to compare"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$base" catalog/ledger | tar -x -C "$RUNNER_TEMP/base"
          go run ./ledger/cmd/ledger check-base "$RUNNER_TEMP/base/catalog/ledger" catalog/ledger

  # Every coefficient set validates through the Go types, and the registry's derivation
  # tests pass. The full re-derivation with the AISimulate sweeps present is rederive.yml.
  registry:
    name: registry
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - run: go run ./validate/cmd/validate-registry registry
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r registry/scripts/requirements.txt
      # Without the AISimulate, CollectiveX and OperatorX data, the tests that re-derive a
      # value from it skip here, and rederive.yml, a gate on the same paths and nightly,
      # runs them with the data present (SUB-4, SUB-8). Every other skip fails this job
      # (X16): the skips allowed here are exactly the data-absent ones, by their message.
      - name: The derivation and value-preservation tests
        working-directory: registry
        run: |
          set -euo pipefail
          python -m pytest validator/ -q -rs | tee "$RUNNER_TEMP/pytest.log"
          # awk, unlike grep, exits 0 when it selects nothing.
          unexpected=$(awk '/^SKIPPED/ && !/AISimulate data not present|CollectiveX run bodies not present|OperatorX MoE response not present|could not import .pyarrow./' "$RUNNER_TEMP/pytest.log")
          if [ -n "$unexpected" ]; then
            echo "skips that rederive.yml does not cover (X16):" >&2
            echo "$unexpected" >&2
            exit 1
          fi

  # The docs site builds with every warning an error: a broken link, a missing snippet, a page
  # left out of the navigation. The hooks render the catalog's and the registry's reference
  # pages from the committed data, so a data change can break the site too.
  docs:
    name: docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r docs/requirements.txt
      - env:
          DOCS_RELEASE: main
        run: python -m pytest docs/hooks -q
      - env:
          DOCS_SOURCE_REF: ${{ github.sha }}
          DOCS_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
        run: mkdocs build --strict

  # The one check branch protection requires. A job its paths did not trigger counts as
  # passed; a job that ran and failed, or was cancelled, fails this one (X16, X17).
  required:
    name: required
    if: always()
    needs: [changes, go, lint, contracts, kernel, mutants, catalog, ledger, registry, docs]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad=$(printf '%s' "$RESULTS" | python3 -c 'import json,sys; n=json.load(sys.stdin); print(" ".join(k for k,v in n.items() if v["result"] not in ("success","skipped")))')
          if [ -n "$bad" ]; then echo "failed or cancelled: $bad"; exit 1; fi
          echo "every job that ran passed"
