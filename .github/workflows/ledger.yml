name: ledger

# The data ledger's seed-holding jobs (design §10.2, §13.5, D7) and the candidate job that
# feeds them.
#
# The role seed lives only in the GitHub environment "ledger", whose branch policy allows
# only main. A ledger owner creates the environment and the seed (catalog/ledger/README.md);
# until then every seed-holding job fails at its first step, by design.
#
# Every scoring run has two halves:
#
#   candidate  runs the pull request's code with no secret, a read-only token, no environment
#              and no network while it predicts. It is handed every unit not on the published
#              lists and writes one prediction per unit, nothing else (ledger.Predictions,
#              64 MB at most). It never learns which unit has which role.
#   select / error / gate
#              run only from main, in the environment that holds the seed. Each checks out
#              main, reads the candidate's predictions as untrusted input with a strict
#              loader, computes roles, and reduces the predictions on its own role's units to
#              aggregates over at least 10 units. The report is checked to name no unit
#              before it is uploaded.
#
# The select job is started by workflow_run when a "ledger candidate" run completes;
# workflow_run always runs this file from the default branch, so a pull request cannot change
# these steps. The error and gate jobs are started by a ledger owner on main, and the release
# job by a ledger owner or the nightly schedule.
# `ledger lint-workflows` (run by ci.yml) refuses any other shape.
#
# Operator-level candidates run here. Whole-run candidates run the dashboard's scoring
# harness and are reduced by accuracy-dashboard's own gate job, with its own seed (§13.5).
#
# Every action is pinned by commit (X21).

on:
  workflow_run:
    workflows: [ledger candidate]
    types: [completed]
  schedule:
    # Nightly: the release dry run, the D2 join and the byte-for-byte regeneration.
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "release: write the published lists; error or gate: reduce one candidate run's predictions"
        type: choice
        options: [release, error, gate]
        required: true
      run_id:
        description: "for error and gate: the id of the ledger candidate run whose predictions to reduce"
        type: string
        required: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ledger-${{ github.event_name }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  # The release job (D7): computes the three published lists from the ledger at main. The
  # release bot commits them in the release pull request; nothing here pushes.
  release:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.job == 'release') || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    environment: ledger
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/go-toolchain
      - name: Compute fit, anchor and report
        env:
          LEDGER_SEED: ${{ secrets.LEDGER_SEED }}
        run: go run ./ledger/cmd/ledger release -out "$RUNNER_TEMP/published" catalog/ledger
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: ${{ runner.temp }}/published
          retention-days: 7

  # The select job: aggregates on select units, for a candidate's predictions. Only a candidate
  # run on main of this repository is reduced, so a pull request gets no select report.
  select:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.id == github.repository_id
    runs-on: ubuntu-latest
    environment: ledger
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/go-toolchain
      - name: Fetch the candidate's predictions (untrusted)
        env:
          GH_TOKEN: ${{ github.token }}
          # The id comes from the workflow_run event, which names a run of the workflow this
          # job is triggered by, so it needs no check of the kind the dispatched jobs make.
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in ''|*[!0-9]*) echo "run_id must be a run id, got '$RUN_ID'" >&2; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/in"
          # The commit the run was made for, from the Actions API and not from the artifact. The
          # strict loader refuses predictions whose candidate field is any other commit (X22).
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          echo "CANDIDATE_SHA=$sha" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name predictions --dir "$RUNNER_TEMP/in"
      - name: Units and measured values, computed here from main
        run: |
          set -euo pipefail
          go run ./ledger/cmd/ledger candidate-units -out "$RUNNER_TEMP/units.json" catalog/ledger
          ./ledger/inferencex/restore.sh ix
          psql -d ix -At -f ledger/inferencex/export.sql -o "$RUNNER_TEMP/rows.jsonl"
          go run ./ledger/cmd/ledger measured-inferencex -rows "$RUNNER_TEMP/rows.jsonl" -out "$RUNNER_TEMP/measured.json" catalog/ledger
      - name: Aggregate on select units
        env:
          LEDGER_SEED: ${{ secrets.LEDGER_SEED }}
        run: |
          go run ./ledger/cmd/ledger aggregate -job select -role select \
            -predictions "$RUNNER_TEMP/in/predictions.json" -candidate "$CANDIDATE_SHA" -units "$RUNNER_TEMP/units.json" \
            -measured "$RUNNER_TEMP/measured.json" -out "$RUNNER_TEMP/report.json" catalog/ledger
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: select-report
          path: ${{ runner.temp }}/report.json

  # The error job: method error on validate units (VAL-5). A ledger owner starts it on main
  # for a candidate run that is itself on main (a merged change; a pull request's run is refused); the nightly schedule that runs it over every method is the error
  # job's next step (README).
  error:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.job == 'error'
    runs-on: ubuntu-latest
    environment: ledger
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/go-toolchain
      - name: Fetch the candidate's predictions (untrusted)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in ''|*[!0-9]*) echo "run_id must be a run id, got '$RUN_ID'" >&2; exit 1 ;; esac
          # A ledger owner types the id, so the run is checked before its artifact is read: it
          # must be a successful run of the ledger candidate workflow of this repository, not a
          # run of another workflow or of a fork.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '[.name, .conclusion, .head_branch, (.head_repository.id | tostring)] | join("|")')
          if [ "$run" != "ledger candidate|success|main|$REPO_ID" ]; then
            echo "run $RUN_ID is not a successful ledger candidate run of this repository on main" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/in"
          # The commit the run was made for, from the Actions API and not from the artifact. The
          # strict loader refuses predictions whose candidate field is any other commit (X22).
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          echo "CANDIDATE_SHA=$sha" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name predictions --dir "$RUNNER_TEMP/in"
      - name: Units and measured values, computed here from main
        run: |
          set -euo pipefail
          go run ./ledger/cmd/ledger candidate-units -out "$RUNNER_TEMP/units.json" catalog/ledger
          ./ledger/inferencex/restore.sh ix
          psql -d ix -At -f ledger/inferencex/export.sql -o "$RUNNER_TEMP/rows.jsonl"
          go run ./ledger/cmd/ledger measured-inferencex -rows "$RUNNER_TEMP/rows.jsonl" -out "$RUNNER_TEMP/measured.json" catalog/ledger
      - name: Aggregate on validate units
        env:
          LEDGER_SEED: ${{ secrets.LEDGER_SEED }}
        run: |
          go run ./ledger/cmd/ledger aggregate -job error -role validate \
            -predictions "$RUNNER_TEMP/in/predictions.json" -candidate "$CANDIDATE_SHA" -units "$RUNNER_TEMP/units.json" \
            -measured "$RUNNER_TEMP/measured.json" -out "$RUNNER_TEMP/report.json" catalog/ledger
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: error-report
          path: ${{ runner.temp }}/report.json

  # The gate job: aggregates on held units, for a pre-registered change (design §10.2, §12.3).
  # Held aggregates are returned only for a pre-registered change. The pre-registration file
  # and its automatic check do not exist yet, so a ledger owner starts this job by hand on main
  # for the candidate run of a change they have checked is pre-registered, and records the
  # evaluation's count on the pull request (README). No pull request can start it.
  gate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.job == 'gate'
    runs-on: ubuntu-latest
    environment: ledger
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/go-toolchain
      - name: Fetch the candidate's predictions (untrusted)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in ''|*[!0-9]*) echo "run_id must be a run id, got '$RUN_ID'" >&2; exit 1 ;; esac
          # A ledger owner types the id, so the run is checked before its artifact is read: it
          # must be a successful run of the ledger candidate workflow of this repository, not a
          # run of another workflow or of a fork.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '[.name, .conclusion, (.head_repository.id | tostring)] | join("|")')
          if [ "$run" != "ledger candidate|success|$REPO_ID" ]; then
            echo "run $RUN_ID is not a successful ledger candidate run of this repository" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/in"
          # The commit the run was made for, from the Actions API and not from the artifact. The
          # strict loader refuses predictions whose candidate field is any other commit (X22).
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          echo "CANDIDATE_SHA=$sha" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name predictions --dir "$RUNNER_TEMP/in"
      - name: Units and measured values, computed here from main
        run: |
          set -euo pipefail
          go run ./ledger/cmd/ledger candidate-units -out "$RUNNER_TEMP/units.json" catalog/ledger
          ./ledger/inferencex/restore.sh ix
          psql -d ix -At -f ledger/inferencex/export.sql -o "$RUNNER_TEMP/rows.jsonl"
          go run ./ledger/cmd/ledger measured-inferencex -rows "$RUNNER_TEMP/rows.jsonl" -out "$RUNNER_TEMP/measured.json" catalog/ledger
      - name: Aggregate on held units
        env:
          LEDGER_SEED: ${{ secrets.LEDGER_SEED }}
        run: |
          go run ./ledger/cmd/ledger aggregate -job gate -role held \
            -predictions "$RUNNER_TEMP/in/predictions.json" -candidate "$CANDIDATE_SHA" -units "$RUNNER_TEMP/units.json" \
            -measured "$RUNNER_TEMP/measured.json" -out "$RUNNER_TEMP/report.json" catalog/ledger
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-report
          path: ${{ runner.temp }}/report.json

  # The gate job's nightly run (D2, D4): the join over every consumer's record of the units it
  # read, checked against the roles the seed gives; and the unit list regenerated from the
  # pinned dump, byte for byte.
  gate-nightly:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: ledger
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/go-toolchain
      - name: Regenerate the InferenceX units from the pinned dump (D4)
        run: |
          set -euo pipefail
          ./ledger/inferencex/restore.sh ix
          psql -d ix -At -f ledger/inferencex/export.sql -o "$RUNNER_TEMP/rows.jsonl"
          curl -fsSL -o "$RUNNER_TEMP/partition.v5.json.gz" \
            https://raw.githubusercontent.com/inference-sim/inference-sim/8e344596c35272e6f505df65c0935aeb5e0000ec/tools/validation/inferencex/partition/partition.v5.json.gz
          go run ./ledger/cmd/ledger check-generated -rows "$RUNNER_TEMP/rows.jsonl" \
            -partition "$RUNNER_TEMP/partition.v5.json.gz" catalog/ledger
      - name: Collect every consumer's record of units read (D2)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reads"
          # Every consumer uploads its record as an artifact named unit-reads-<consumer>. Only
          # an artifact that a run on main of this repository uploaded is read: a pull request
          # run, or a run of a fork, can upload an artifact of that name too, and a record from
          # one of those would enter a join that holds the seed.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("unit-reads-")) | select(.expired | not) | select(.workflow_run.head_branch == "main" and (.workflow_run.head_repository_id | tostring) == env.REPO_ID) | .id' |
          while read -r id; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/a.zip"
            unzip -o -q "$RUNNER_TEMP/a.zip" -d "$RUNNER_TEMP/reads/$id"
          done
      - name: The join (D2)
        env:
          LEDGER_SEED: ${{ secrets.LEDGER_SEED }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/reads/*/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no consumer has uploaded a record of units read; the join has nothing to check" >&2
            exit 1
          fi
          # The join's own message names a file or an artifact when a record does not decode,
          # and which record failed is not for the log of a job that holds the seed. Only the
          # outcomes it counts are shown.
          if ! go run ./ledger/cmd/ledger join -assign catalog/ledger "${files[@]}" 2>"$RUNNER_TEMP/join.err"; then
            sed -n -E '/units read under two roles|records hold no read/p' "$RUNNER_TEMP/join.err" >&2
            echo "the join failed; the detail of a record it could not read is withheld" >&2
            exit 1
          fi
