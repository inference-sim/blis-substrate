name: shared nightly checks

# The nightly checks every BLIS repository runs (design §13.4). Called by commit from a
# scheduled workflow:
#
#   on:
#     schedule: [{cron: "17 5 * * *"}]
#   jobs:
#     nightly:
#       uses: inference-sim/blis-substrate/.github/workflows/shared-nightly.yml@<40-hex commit>
#       with:
#         substrate-ref: <the same commit>
#
#   cited-issues  X28: every issue cited as the reason for a refusal or a gap is open
#   quarantine    X25: no quarantined test has expired
#   tags          LIF-1: every tag resolves to the commit .github/tags.lock records

on:
  workflow_call:
    inputs:
      substrate-ref:
        type: string
        required: true

permissions:
  contents: read
  issues: read

env:
  GOTOOLCHAIN: local

jobs:
  nightly:
    name: nightly checks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inference-sim/blis-substrate
          ref: ${{ inputs.substrate-ref }}
          path: substrate
      - uses: ./substrate/.github/actions/go-toolchain
        with:
          module-dir: substrate
      - working-directory: substrate
        run: go build -o "$RUNNER_TEMP/prcheck" ./tools/prcheck
      - name: Cited issues are open (X28)
        working-directory: repo
        run: '"$RUNNER_TEMP/prcheck" issues -repo "${{ github.repository }}" -resolve'
      - name: Quarantine list (X25)
        working-directory: repo
        run: '"$RUNNER_TEMP/prcheck" quarantine'
      - name: Every tag resolves to its recorded commit (LIF-1)
        working-directory: repo
        run: '"$RUNNER_TEMP/prcheck" tags -lock .github/tags.lock'
