# The quarantine list (X25): tests in a required or gate job that cannot run or fail on the
# main branch, each with an owning issue and an expiry at most 30 days after it was added. A
# listed test's skip does not fail its gate (X16) until the entry expires; then CI fails. The
# format is in tools/prcheck/quarantine.go. A gate reads this list through `prcheck skips`.
