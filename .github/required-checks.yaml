# The checks each BLIS repository's protected branch requires (X17), as a person sets them
# in branch protection. The nightly merge audit reads this list and fails when a merged
# head has no successful run of each on the tree it merged. A change here and in the
# repository's settings go together; the list states what the settings must be.
#
# Names are check-run names, as the API lists them: "pr / blis checks" is the shared
# pull-request workflow's job as the caller job "pr" names it; "required" is a repository's
# own gate job, where it has one; "scan" is private-names (X12).
#
# rederive and ledger-candidate are gates filtered by path, so GitHub has no run to require on
# a pull request that touches none of their paths. They are not listed; ci.yml's `required` job
# is their aggregator. It reads their path lists from the workflow files, takes the change's
# files from git diff, and fails unless each workflow whose paths the change touched has a
# successful check run on the pull request's head. On the merge queue (none is enabled today)
# both also trigger on merge_group, where GitHub applies no paths filter, and each starts with a
# cheap `changes` job; the aggregator then requires a successful run of each at the merge-queue
# commit, always, with the heavy job allowed to be skipped only when no path changed. `scan`
# runs on the merge queue as well as on the pull request (private-names.yml has a merge_group
# trigger), and the merge check requires it on the merge-queue tree.
blis-substrate: [required, "pr / blis checks", scan]
blis-vllm: ["pr / blis checks"]
blis-sglang: ["pr / blis checks"]
llm-d-router: ["pr / blis checks", hosting]
inference-sim: ["pr / blis checks"]
accuracy-dashboard: ["pr / blis checks"]
blis-config-search: ["pr / blis checks"]
