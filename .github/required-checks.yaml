# The checks each BLIS repository's protected branch requires (X17), as a person sets them
# in branch protection. The nightly merge audit reads this list and fails when a merged
# head has no successful run of each on the tree it merged. A change here and in the
# repository's settings go together; the list states what the settings must be.
#
# Names are check-run names, as the API lists them: "pr / blis checks" is the shared
# pull-request workflow's job as the caller job "pr" names it; "required" is a repository's
# own gate job, where it has one; "scan" is private-names (X12).
#
# rederive is a gate but is not listed: rederive.yml and ledger-candidate.yml are filtered by
# path, so GitHub has no run to require on a pull request that touches none of their paths, and
# a required check that never starts blocks the merge. See the release notes of this change.
blis-substrate: [required, "pr / blis checks", scan]
blis-vllm: ["pr / blis checks"]
blis-sglang: ["pr / blis checks"]
llm-d-router: ["pr / blis checks", hosting]
inference-sim: ["pr / blis checks"]
accuracy-dashboard: ["pr / blis checks"]
blis-config-search: ["pr / blis checks"]
