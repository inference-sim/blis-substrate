  "contracts: TestNoPriceDependsOnAFreeTextLabel": [contracts and validators]
  "contracts: TestEveryLoaderRefusesTheMalformedSet": [contracts and validators]
  "ci.yml job contracts: prcheck contracts-apidiff": [contracts and validators]
  "contracts/spec/coefficient: TestAUnitThatTheFormulaDoesNotNeedIsRefused": [contracts and validators]
  "contracts/spec/hardware: TestPeaksAreDenseFigures": [contracts and validators]
  "contracts/units: TestMixedUnitsDoNotCompile": [contracts and validators]
