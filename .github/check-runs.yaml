# The check run that proves each registry check (LIF-3, #15). The release bot builds its results
# from the check runs of the exact commit it tags, through this file, and never reads a results
# file a person wrote. Keys are a repository, then the `test` string of a registry check with
# status ci; the value is the check-run names that must all have concluded success at the
# commit. A name ending in `*` stands for every check run whose name begins with the text before
# it (a matrix), at least one of which must exist. A skipped run is not a success: run the
# workflow by hand on the commit being tagged (workflow_dispatch), which runs every job.
#
# `go test ./tools/release` fails when a ci check of the registry has no entry here, and when an
# entry names no ci check of the registry, so this file cannot drift from the registry.
blis-substrate:
  "go run ./validate/cmd/validate-registry registry": [registry]
  "ledger: TestUnpinnedRevisionsRefused": [ledger]
  "ledger: TestCheckAgainstBase": [ledger]
  "ledger: TestNoCommittedRoles": [ledger]
  "ledger: TestLintWorkflows": [ledger]
  "tools/modlint: TestEachRuleHasAKnownBadInput": [contracts and validators]
