name: go-toolchain
description: >-
  Install exactly the Go toolchain named in blis-substrate's contracts/toolchain, and fail if
  the go command reports any other version (LIF-2). In blis-substrate the file is read from the
  checkout; in another repository it is read from the blis-substrate version that repository's
  go.mod requires. Callers set GOTOOLCHAIN=local on the job, so no build downloads a toolchain.
  Call it after actions/checkout, by commit:
  uses: inference-sim/blis-substrate/.github/actions/go-toolchain@<commit>

inputs:
  module-dir:
    description: The directory holding the module's go.mod.
    default: .

  build-cache:
    description: >-
      A name for this job's Go build cache. When set, the build cache (compiled packages, race
      builds, test binaries) of the newest earlier run with the same name is restored, and
      build-cache-key is the key to save under. Entries are content-addressed, so a stale cache
      is never wrong, only less useful. Saving is the caller's step (actions/cache/save), and
      callers save on pushes and manual runs, not on pull requests, so a pull request only reads
      the cache of main. Empty: no build cache.
    default: ""

outputs:
  build-cache-key:
    description: The key to save the build cache under; empty when build-cache is empty.
    value: ${{ steps.cachekey.outputs.key }}
  version:
    description: The installed version, as the go command reports it (for example go1.N.M).
    value: ${{ steps.read.outputs.version }}

runs:
  using: composite
  steps:
    - id: read
      shell: bash
      working-directory: ${{ inputs.module-dir }}
      run: |
        set -euo pipefail
        if [ "$(sed -n 's/^module //p' go.mod)" = "github.com/inference-sim/blis-substrate" ]; then
          file=contracts/toolchain
        else
          v=$(awk '$1=="github.com/inference-sim/blis-substrate" {print $2; exit} $1=="require" && $2=="github.com/inference-sim/blis-substrate" {print $3; exit}' go.mod)
          if [ -z "$v" ]; then
            echo "go.mod does not require github.com/inference-sim/blis-substrate, so contracts/toolchain cannot be read" >&2
            exit 1
          fi
          # Any installed go can download a module by path and version outside a module.
          dir=$(cd "$RUNNER_TEMP" && GOTOOLCHAIN=local GOFLAGS= go mod download -json "github.com/inference-sim/blis-substrate@$v" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Dir"])')
          file="$dir/contracts/toolchain"
        fi
        version=$(tr -d '[:space:]' < "$file")
        case "$version" in
          go1.*) ;;
          *) echo "contracts/toolchain holds '$version', not a Go version of the form go1.N.M" >&2; exit 1 ;;
        esac
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "number=${version#go}" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.read.outputs.number }}
        check-latest: false
    - shell: bash
      env:
        WANT: ${{ steps.read.outputs.version }}
      run: |
        set -euo pipefail
        got=$(GOTOOLCHAIN=local go env GOVERSION)
        if [ "$got" != "$WANT" ]; then
          echo "go reports $got; contracts/toolchain names $WANT (LIF-2)" >&2
          exit 1
        fi
        echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
        echo "go toolchain: $got"
    - id: cachekey
      shell: bash
      env:
        NAME: ${{ inputs.build-cache }}
      run: |
        set -euo pipefail
        if [ -n "$NAME" ]; then
          echo "key=gobuild-$NAME-$RUNNER_OS-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "prefix=gobuild-$NAME-$RUNNER_OS-" >> "$GITHUB_OUTPUT"
        else
          echo "key=" >> "$GITHUB_OUTPUT"
        fi
    - if: inputs.build-cache != ''
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/go-build
        key: ${{ steps.cachekey.outputs.key }}
        restore-keys: ${{ steps.cachekey.outputs.prefix }}
